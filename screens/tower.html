<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Torre de Gelo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#060f1c;--pan:#0d1a2ecc;--line:rgba(0,229,255,.16);--cy:#00E5FF;--go:#ffd700;--ok:#4ade80;--bad:#ff6b6b}
html,body{height:100%}
body{font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;background:#060f1c;color:#e8f6ff;overflow:hidden;-webkit-tap-highlight-color:transparent;position:relative}
h1,h2,.ui{font-family:'Outfit',ui-sans-serif,system-ui,sans-serif}
.neon{text-shadow:0 0 12px rgba(0,240,255,.8),0 0 28px rgba(0,229,255,.35)}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(900px 560px at 25% -8%,#123a5e 0%,#0A1A2A 40%,#060F1C 72%,#040A12 100%)}
#bgfx .orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.14}
#bgfx .o1{width:380px;height:380px;left:4%;top:8%;background:#22d3ee}
#bgfx .o2{width:460px;height:460px;right:0%;top:28%;background:#38bdf8}
#bgfx .o3{width:320px;height:320px;left:16%;bottom:4%;background:#60a5fa}
#bgfx .crys{position:absolute;opacity:.07;background:linear-gradient(135deg,rgba(125,211,252,.9),rgba(255,255,255,.6) 40%,rgba(0,229,255,.5));clip-path:polygon(50% 0%,90% 20%,90% 80%,50% 100%,10% 80%,10% 20%)}
#bgfx .c1{width:120px;height:220px;left:-30px;top:18%;transform:rotate(8deg)}
#bgfx .c2{width:150px;height:260px;right:-40px;top:46%;transform:rotate(-10deg)}
#bgfx .fog{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:92%;height:24%;background:radial-gradient(ellipse at center,rgba(0,229,255,.16) 0%,transparent 70%);filter:blur(16px);animation:fogmv 12s ease-in-out infinite alternate}
@keyframes fogmv{0%{transform:translateX(-52%)}100%{transform:translateX(-48%)}}
.snow{position:absolute;top:-10%;animation:fall linear infinite;opacity:.85}
@keyframes fall{0%{transform:translateY(0) translateX(0)}100%{transform:translateY(112vh) translateX(18px)}}
@media(prefers-reduced-motion:reduce){.snow{display:none}#bgfx .fog{animation:none}}
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;gap:10px;padding:12px;padding-top:max(12px,env(safe-area-inset-top))}
#top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid rgba(0,229,255,.18);padding-bottom:10px}
.back{border:1px solid rgba(0,229,255,.25);background:rgba(255,255,255,.08);color:#dff6ff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:11px;letter-spacing:.03em;cursor:pointer;white-space:nowrap;transition:.15s}
.back:hover{background:rgba(255,255,255,.14);border-color:rgba(125,211,252,.5)}
#title{flex:1;min-width:160px;text-align:center}
#title h1{font-size:14px;font-weight:800;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:7px;color:#fff}
#title .ico{display:inline-flex;width:24px;height:24px;border-radius:50%;background:rgba(0,229,255,.16);border:1px solid rgba(125,211,252,.35);align-items:center;justify-content:center;font-size:13px;box-shadow:0 0 12px rgba(0,229,255,.5)}
#title p{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(125,211,252,.65);font-weight:700;margin-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(0,229,255,.3);background:rgba(15,31,53,.8);border-radius:999px;padding:6px 11px;font-size:10px;font-weight:600;white-space:nowrap;color:rgba(224,247,255,.85)}
.chip b{color:#fff;font-weight:800}
.chip.gold{background:linear-gradient(90deg,rgba(0,229,255,.18),rgba(14,165,233,.18));border-color:rgba(125,211,252,.4);color:#e0faff;box-shadow:0 0 12px rgba(0,229,255,.25)}
#prog{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;flex:none;box-shadow:inset 0 0 0 1px rgba(0,229,255,.1)}
#prog i{display:block;height:100%;background:linear-gradient(90deg,#00E5FF,#4ade80);box-shadow:0 0 10px rgba(0,229,255,.6);transition:width .4s}
#body{flex:1;min-height:0;overflow:auto;padding-right:2px;display:grid;gap:12px}
@media(min-width:760px){#body{grid-template-columns:1fr 300px}}
#towerPanel{border-radius:20px;border:1px solid rgba(0,229,255,.22);background:rgba(13,26,46,.72);backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,229,255,.06);padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0;max-height:min(70vh,560px)}
@media(min-width:760px){#towerPanel{max-height:none}}
#towerPanel .ph{display:flex;align-items:center;justify-content:space-between}
#towerPanel .ph h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(224,247,255,.9);display:flex;align-items:center;gap:6px;font-weight:700}
#towerPanel .ph h2 i{display:inline-flex;width:22px;height:22px;border-radius:7px;background:rgba(15,31,53,1);border:1px solid rgba(0,229,255,.35);align-items:center;justify-content:center;font-size:11px;box-shadow:0 0 10px rgba(0,229,255,.3)}
#towerPanel .ph small{font-size:10px;color:rgba(125,211,252,.6);font-weight:700}
/* Torre de verdade: coluna vertical, andar 30 no topo e andar 1 embaixo — sobe conforme o relato do pedido. */
#grid{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 2px 6px 0;display:flex;flex-direction:column}
#grid::-webkit-scrollbar{width:7px}
#grid::-webkit-scrollbar-thumb{background:linear-gradient(#00E5FF,#0ea5e9);border-radius:999px}
#grid::-webkit-scrollbar-track{background:rgba(14,165,233,.08)}
#grid::before{content:'';position:absolute;left:25px;top:0;bottom:0;width:3px;background:linear-gradient(180deg,rgba(0,229,255,.5),rgba(0,229,255,.08));border-radius:999px}
.fl{all:unset;display:flex;align-items:center;gap:10px;position:relative;padding:8px 10px 8px 0;cursor:pointer;border-radius:12px;transition:.15s}
.fl:not(.locked):hover{background:rgba(255,255,255,.05)}
.fl .badge{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--neon,#00E5FF);background:#0d1a2e;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-weight:800;font-size:12px;color:#fff;position:relative;z-index:1;box-shadow:0 0 10px color-mix(in srgb,var(--neon,#00E5FF) 50%,transparent)}
.fl .sp{flex:none;width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);background-size:cover;background-position:center}
.fl .info{flex:1;min-width:0}
.fl .info b{display:block;font-size:11.5px;color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .info small{display:block;font-size:9.5px;color:rgba(224,247,255,.55);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.fl .rw{flex:none;font-size:10px;font-weight:800;color:#ffe9a3;white-space:nowrap}
.fl.on{background:color-mix(in srgb,var(--neon,#00E5FF) 14%,transparent)}
.fl.on .badge{animation:pulseFl 1.8s ease-in-out infinite}
@keyframes pulseFl{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}
.fl.beat .badge{background:rgba(74,222,128,.18);border-color:#4ade80}
.fl.beat .badge::after{content:'✓';position:absolute;top:-3px;right:-3px;font-size:9px;background:#4ade80;color:#042a1a;border-radius:50%;width:13px;height:13px;display:flex;align-items:center;justify-content:center}
.fl.locked{cursor:not-allowed;filter:grayscale(.75);opacity:.42}
.fl.locked .badge{border-color:rgba(255,255,255,.2);box-shadow:none}
.fl.locked::after{content:'🔒';position:absolute;right:6px;font-size:11px;opacity:.7}
.fl.boss .badge{border-color:#ffd700;box-shadow:0 0 12px rgba(255,215,0,.5)}
#detail{border-radius:20px;border:1px solid rgba(0,229,255,.22);background:rgba(13,26,46,.78);backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.5);padding:16px;display:flex;flex-direction:column;gap:9px;align-self:start}
#detail .tierbar{height:3px;border-radius:999px;background:linear-gradient(90deg,var(--neon,#00E5FF),transparent);margin:-4px 0 2px}
#detail .top{display:flex;align-items:center;gap:10px}
#detail .em{font-size:34px;filter:drop-shadow(0 0 10px var(--neon,#00E5FF))}
#detail h2{font-size:14px;font-weight:800;color:#fff}
#detail .tier{font-size:10px;font-weight:700;color:var(--neon,#00E5FF);text-transform:uppercase;letter-spacing:.08em}
#detail .lk{font-size:11.5px;color:rgba(224,247,255,.65);line-height:1.5}
#detail .tags{display:flex;gap:6px;flex-wrap:wrap}
#detail .tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:5px 10px;border-radius:999px;background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.25);font-weight:700;color:rgba(224,247,255,.9)}
#detail .tag.gold{background:rgba(255,215,0,.1);border-color:rgba(255,215,0,.4);color:#ffe9a3}
.btn.go{position:relative;overflow:hidden;border:none;background:linear-gradient(90deg,#00E5FF,#0ea5e9);color:#042a33;border-radius:12px;padding:12px 16px;font-size:12px;font-weight:800;letter-spacing:.03em;cursor:pointer;box-shadow:0 0 22px rgba(0,229,255,.45);font-family:'Outfit',sans-serif;margin-top:4px}
.btn.go:hover{filter:brightness(1.08)}
.btn.go:active{transform:scale(.98)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);background:rgba(10,14,22,.95);border:1px solid var(--cy);border-radius:10px;padding:10px 14px;font-size:11px;opacity:0;transition:.25s;pointer-events:none;z-index:40;max-width:92vw;text-align:center;font-family:'Space Grotesk',sans-serif}
#toast.on{opacity:1;transform:translateX(-50%)}
.tower-scroll::-webkit-scrollbar{width:7px}
#body::-webkit-scrollbar{width:7px}
#body::-webkit-scrollbar-thumb{background:linear-gradient(#00E5FF,#0ea5e9);border-radius:999px}
#body::-webkit-scrollbar-track{background:rgba(14,165,233,.08)}
</style>
</head>
<body>
<div id="bgfx">
 <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
 <div class="crys c1"></div><div class="crys c2"></div>
 <div class="fog"></div>
 <div id="snowWrap"></div>
</div>
<div id="app">
 <div id="top">
  <button class="back" id="back" aria-label="Voltar ao mapa">← Voltar ao mapa</button>
  <div id="title">
   <h1 class="neon"><span class="ico">🏔️</span>PICOS CONGELADOS — TORRE DE GELO</h1>
   <p>Torre de Batalha • 30 Andares • Dark Ice Edition</p>
  </div>
  <div class="chips">
   <span class="chip">Andar <b id="cur">1</b>/30</span>
   <span class="chip">Melhor <b id="bst">0</b></span>
   <span class="chip gold">❄️ <b id="co">0</b> moedas</span>
  </div>
 </div>
 <div id="prog"><i id="progi" style="width:0%"></i></div>
 <div id="body">
  <div id="towerPanel">
   <div class="ph"><h2><i>🧊</i>Torre de Gelo</h2><small id="cnt0">0/30 concluídos</small></div>
   <div id="grid"></div>
  </div>
  <div id="detail"></div>
 </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
const $=s=>document.querySelector(s);
const post=o=>parent.postMessage(Object.assign({numius:1},o),'*');
let D=null,SEL=1,IMGS={},scrolled=false;
let tT=0;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>e.classList.remove('on'),2200)}

/* neve: só uma vez, decorativo */
(function snow(){
 const w=$('#snowWrap'),n=34,fl=['❄','❅','•'];
 for(let i=0;i<n;i++){
  const s=document.createElement('span');
  s.className='snow';s.textContent=fl[i%fl.length];
  s.style.left=(i*7.13%100)+'%';
  s.style.fontSize=(i%3===0?'10px':'7px');
  s.style.color=i%2===0?'rgba(125,211,252,.9)':'rgba(255,255,255,.85)';
  s.style.textShadow='0 0 8px '+(i%2===0?'#00E5FF':'#fff');
  s.style.animationDelay=(i*0.31%6)+'s';
  s.style.animationDuration=(7+i%8)+'s';
  w.appendChild(s);
 }
})();

function grid(){
 const g=$('#grid');g.innerHTML='';
 /* andar 30 no topo da coluna, andar 1 embaixo: a torre "sobe" conforme o jogador rola pra cima */
 [...D.floors].reverse().forEach(f=>{
  const b=document.createElement('button');
  b.className='fl'+(f.id===SEL?' on':'')+(f.locked?' locked':'')+(f.id<=D.best?' beat':'')+(f.boss?' boss':'');
  b.style.setProperty('--neon',f.neon||'#00E5FF');
  b.setAttribute('aria-label','Andar '+f.id+(f.locked?' (bloqueado)':'')+': '+f.trainer);
  const spImg=IMGS['f'+f.spi];
  b.innerHTML=`<span class="badge">${f.id}</span>
   <span class="sp" style="${spImg?`background-image:url('${spImg}')`:''}" title="${f.spn||''}"></span>
   <span class="info"><b>${f.trainer}</b><small>${f.tier}${f.boss?' · Final':''}</small></span>
   <span class="rw">💰${f.reward}</span>`;
  b.disabled=f.locked;
  b.onclick=()=>{SEL=f.id;grid();detail()};
  g.appendChild(b);
  if(f.id===SEL)b.dataset.sel='1';
 });
 if(!scrolled){scrolled=true;const sel=g.querySelector('[data-sel="1"]');if(sel)sel.scrollIntoView({block:'center'})}
}
function detail(){
 const f=D.floors.find(x=>x.id===SEL)||D.floors[0],w=$('#detail');
 if(!f){w.innerHTML='';return}
 w.style.setProperty('--neon',f.neon||'#00E5FF');
 const spImg=IMGS['f'+f.spi];
 w.innerHTML=`<div class="tierbar"></div>
  <div class="top"><span class="em">${f.locked?'🔒':f.icon}</span>
   <div><h2>${f.locked?'Andar bloqueado':'Andar '+f.id}</h2>${f.locked?'':`<div class="tier">${f.tier}</div>`}</div></div>
  <div class="lk">${f.locked?'Vença o andar '+(D.best+1)+' primeiro para destravar este.':'Treinador: <b style="color:#fff">'+f.trainer+'</b>'}</div>
  ${(!f.locked&&spImg)?`<div style="display:flex;align-items:center;gap:8px"><span style="width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);background-image:url('${spImg}');background-size:cover;background-position:center;flex:none"></span><span class="lk">Númio principal: <b style="color:#fff">${f.spn||''}</b></span></div>`:''}
  <div class="tags">
   <span class="tag">⚔️ ${f.cnt} númios</span>
   <span class="tag gold">💰 +${f.reward}</span>
   ${f.boss?'<span class="tag gold">👑 Andar final</span>':''}
  </div>
  ${f.locked?'':`<button class="btn go" id="fightBtn">⚔️ SUBIR O ANDAR ${f.id}</button>`}`;
 const fb=$('#fightBtn');if(fb)fb.onclick=()=>post({k:'fight',n:f.id});
}
function render(){
 if(!D)return;
 $('#co').textContent=D.coins;$('#bst').textContent=D.best;$('#cur').textContent=Math.min(30,D.best+1);
 $('#cnt0').textContent=D.best+'/30 concluídos';
 $('#progi').style.width=Math.min(100,D.best/30*100)+'%';
 if(SEL>D.best+1)SEL=D.best+1;
 grid();detail();
}
$('#back').onclick=()=>post({k:'nav'});
addEventListener('keydown',e=>{if(e.key==='Escape')post({k:'nav'})});
addEventListener('message',e=>{const m=e.data||{};if(!m.numius)return;
 if(m.k==='twdata'){if(m.imgs)IMGS=m.imgs;D=m;render()}
});
post({k:'ready'});
})();
</script>
</body>
</html>
