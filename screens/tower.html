<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Torre de Gelo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'JetBrains Mono',ui-monospace,monospace}
:root{--bg:#060f1c;--pan:#0d1a2e;--line:rgba(0,229,255,.14);--cy:#00E5FF;--go:#ffd700;--ok:#4ade80;--bad:#ff6b6b}
html,body{height:100%}
body{background:radial-gradient(900px 500px at 25% -10%,#12304e 0%,#0A1A2A 38%,#060F1C 70%,#040A12 100%);color:#e8f6ff;overflow:hidden;-webkit-tap-highlight-color:transparent}
.px{font-family:'Press Start 2P',monospace;letter-spacing:.04em}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding:12px;padding-top:max(12px,env(safe-area-inset-top))}
#top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:11px;color:var(--cy);text-shadow:0 0 14px rgba(0,229,255,.55);flex:1;min-width:130px}
.btn{border:1px solid var(--line);background:rgba(0,229,255,.06);color:#fff;border-radius:10px;padding:9px 12px;font-size:11px;font-weight:700;letter-spacing:.08em;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:rgba(0,229,255,.14)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.go{background:linear-gradient(90deg,#00E5FF,#0ea5e9);color:#042a33;border-color:transparent;box-shadow:0 0 22px rgba(0,229,255,.45)}
.btn.go:hover{filter:brightness(1.08)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(0,229,255,.05);border-radius:999px;padding:6px 11px;font-size:11px;font-weight:700;white-space:nowrap}
.chip b{color:var(--go)}
#prog{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;flex:none}
#prog i{display:block;height:100%;background:linear-gradient(90deg,#00E5FF,#4ade80)}
#body{flex:1;min-height:0;overflow:auto;padding-right:2px;display:grid;gap:10px}
@media(min-width:700px){#body{grid-template-columns:1fr 280px}}
#grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;align-content:start}
@media(max-width:420px){#grid{grid-template-columns:repeat(5,1fr)}}
.fl{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);background:rgba(255,255,255,.04);color:#fff;font-size:11px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.fl.on{border-color:var(--cy);background:rgba(0,229,255,.18);box-shadow:0 0 14px rgba(0,229,255,.5)}
.fl.beat{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.35)}
.fl.locked{opacity:.3;cursor:not-allowed}
.fl.boss{border-color:var(--go)}
.fl small{position:absolute;bottom:2px;font-size:8px;opacity:.7}
#detail{border:1px solid var(--line);background:var(--pan);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;align-self:start}
#detail .em{font-size:34px}
#detail h2{font-size:14px}
#detail .tag{display:inline-block;font-size:10px;padding:4px 9px;border-radius:999px;background:rgba(0,229,255,.1);border:1px solid var(--line);font-weight:700;margin-right:4px;margin-top:4px}
#detail .lk{font-size:11px;color:rgba(255,255,255,.55)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);background:rgba(10,14,22,.95);border:1px solid var(--cy);border-radius:10px;padding:10px 14px;font-size:11px;opacity:0;transition:.25s;pointer-events:none;z-index:40;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
 <div id="top">
  <button class="btn" id="back" aria-label="Voltar ao mapa">← VOLTAR</button>
  <h1 class="px">TORRE DE GELO</h1>
  <span class="chip" title="Moedas">💰 <b id="co">0</b></span>
  <span class="chip" title="Andar liberado">❄️ <b id="bst">0</b>/30</span>
 </div>
 <div id="prog"><i id="progi" style="width:0%"></i></div>
 <div id="body">
  <div id="grid"></div>
  <div id="detail"></div>
 </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
const $=s=>document.querySelector(s);
const post=o=>parent.postMessage(Object.assign({numius:1},o),'*');
let D=null,SEL=1;
let tT=0;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>e.classList.remove('on'),2200)}

function grid(){
 const g=$('#grid');g.innerHTML='';
 D.floors.forEach(f=>{
  const b=document.createElement('button');
  b.className='fl'+(f.id===SEL?' on':'')+(f.locked?' locked':'')+(f.id<=D.best?' beat':'')+(f.boss?' boss':'');
  b.setAttribute('aria-label','Andar '+f.id+(f.locked?' (bloqueado)':''));
  b.innerHTML=f.id+(f.boss?'<small>👑</small>':'');
  b.disabled=f.locked;
  b.onclick=()=>{SEL=f.id;grid();detail()};
  g.appendChild(b);
 });
}
function detail(){
 const f=D.floors.find(x=>x.id===SEL)||D.floors[0],w=$('#detail');
 if(!f){w.innerHTML='';return}
 w.innerHTML=`<span class="em">${f.locked?'🔒':f.icon}</span>
  <h2>${f.locked?'Andar bloqueado':'Andar '+f.id+' · '+f.tier}</h2>
  <div class="lk">${f.locked?'Vença o andar '+(D.best+1)+' primeiro.':'Treinador: '+f.trainer}</div>
  <div>
   <span class="tag">${f.cnt} númios</span>
   <span class="tag">💰 +${f.reward}</span>
   ${f.boss?'<span class="tag">👑 Andar final</span>':''}
  </div>
  ${f.locked?'':`<button class="btn go" id="fightBtn" style="margin-top:6px">⚔️ SUBIR O ANDAR ${f.id}</button>`}`;
 const fb=$('#fightBtn');if(fb)fb.onclick=()=>post({k:'fight',n:f.id});
}
function render(){
 if(!D)return;
 $('#co').textContent=D.coins;$('#bst').textContent=D.best;
 $('#progi').style.width=Math.min(100,D.best/30*100)+'%';
 if(SEL>D.best+1)SEL=D.best+1;
 grid();detail();
}
$('#back').onclick=()=>post({k:'nav'});
addEventListener('keydown',e=>{if(e.key==='Escape')post({k:'nav'})});
addEventListener('message',e=>{const m=e.data||{};if(!m.numius)return;
 if(m.k==='twdata'){D=m;render()}
});
post({k:'ready'});
})();
</script>
</body>
</html>
