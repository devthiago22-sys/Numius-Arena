<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Zona Safari</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--px:'Press Start 2P',monospace;--mono:'JetBrains Mono',ui-monospace,monospace;--ac:#86efac}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1a10;color:#fff;font-family:var(--mono);-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#world{position:fixed;inset:0;width:100%;height:100%;display:block}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--px);font-size:12px;color:#d9f99d;background:radial-gradient(circle,#14361f,#06120a);z-index:50;transition:opacity .4s}
#load.off{opacity:0;pointer-events:none}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 12px;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
.btn{white-space:nowrap;padding:9px 14px;border-radius:14px;background:rgba(10,30,18,.78);backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.22);font-weight:800;font-size:12px;letter-spacing:.04em;box-shadow:0 4px 14px rgba(0,0,0,.35);min-height:40px;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn.go{background:linear-gradient(180deg,#d9f99d,#4ade80);color:#052e16;border-color:#fff8}
.ttl{font-family:var(--px);font-size:clamp(10px,1.8vh,14px);color:#fff;text-shadow:0 2px 0 #14532d,0 0 14px #4ade80;margin-left:10px;align-self:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:99px;background:rgba(10,30,18,.72);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#toast{position:fixed;left:50%;top:66px;transform:translate(-50%,-10px);padding:9px 18px;border-radius:14px;background:rgba(10,30,18,.85);backdrop-filter:blur(6px);border:2px solid var(--ac);font-family:var(--px);font-size:10px;opacity:0;transition:opacity .35s,transform .35s;z-index:6;pointer-events:none;white-space:nowrap;box-shadow:0 0 18px rgba(74,222,128,.35)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#pad{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));display:none;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:4px;z-index:5}
#pad button{border-radius:50%;background:rgba(10,30,18,.55);backdrop-filter:blur(4px);border:2px solid rgba(255,255,255,.3);font-size:20px;box-shadow:0 3px 10px rgba(0,0,0,.3);touch-action:none}
#pad button.on{background:rgba(74,222,128,.6)}
@media (pointer:coarse){#pad{display:grid}#hint{display:none}}
body.touch #pad{display:grid}body.touch #hint{display:none}
#hint{position:fixed;right:14px;bottom:14px;font-size:11px;color:#ecfccb;background:rgba(10,30,18,.65);backdrop-filter:blur(6px);padding:7px 12px;border-radius:12px;z-index:5}
@media(max-width:640px){.ttl{display:none}}
/* ---------- encontro ---------- */
#wipe{position:fixed;inset:0;width:100%;height:100%;z-index:30;pointer-events:none;display:none}
#enc{position:fixed;inset:0;z-index:20;display:none;overflow:hidden}
#enc.on{display:block}
#ebg{position:absolute;inset:0;width:100%;height:100%}
#wild{position:absolute;left:66%;top:40%;width:min(46vmin,390px);height:min(46vmin,390px);transform:translate(-50%,-50%)}
#wild canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 10px rgba(0,0,0,.35))}
#wild.bond canvas{animation:bond 1.2s ease-in-out forwards}
@keyframes bond{40%{filter:brightness(2.6) drop-shadow(0 0 30px #fff)}100%{filter:brightness(1.15) drop-shadow(0 0 22px #fde68a)}}
#rc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#trainer{position:absolute;left:5%;bottom:24%;width:min(28vmin,230px);height:auto;background-repeat:no-repeat;background-size:400% 100%;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{scale:1 1}50%{scale:1.012 .985}}
.card{position:absolute;border-radius:16px;background:rgba(8,24,14,.82);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.2);padding:10px 12px;font-size:12px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#info{left:50%;top:12px;transform:translateX(-50%);min-width:min(92vw,340px);text-align:center}
#info b{font-family:var(--px);font-size:12px}
.meter{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:10px;font-weight:800;letter-spacing:.06em}
.meter .bar{flex:1;height:10px;border-radius:99px;background:rgba(0,0,0,.45);border:1px solid rgba(0,0,0,.6);overflow:hidden}
.meter .bar i{display:block;height:100%;transition:width .45s;border-radius:99px}
#bondb i{background:linear-gradient(90deg,#f9a8d4,#fde68a)}
#agib i{background:linear-gradient(90deg,#fbbf24,#ef4444)}
#panel{left:50%;bottom:12px;transform:translateX(-50%);width:min(96vw,720px);display:flex;flex-direction:column;gap:8px}
#emsg{min-height:20px;font-size:13px}
#acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#acts button{padding:10px 6px;border-radius:14px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);font-weight:800;font-size:11px;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .12s,background .2s}
#acts button:hover:not(:disabled){transform:translateY(-2px);background:rgba(255,255,255,.14)}
#acts button span{font-size:20px}
#acts button.main{background:linear-gradient(180deg,#fbcfe8,#f472b6);color:#3b0a24;border-color:#fff8;box-shadow:0 0 16px rgba(244,114,182,.45)}
#tap{display:none;padding:16px;border-radius:16px;background:linear-gradient(180deg,#fde68a,#f59e0b);color:#3b2506;font-family:var(--px);font-size:14px;border:2px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.4),0 0 20px rgba(251,191,36,.5);animation:tapp .5s ease-in-out infinite alternate}
@keyframes tapp{to{transform:scale(1.03)}}
#tap.on{display:block}
#judge{position:absolute;left:66%;top:12%;transform:translateX(-50%);font-family:var(--px);font-size:clamp(12px,2.6vh,20px);text-shadow:0 2px 0 #000,0 0 12px currentColor;pointer-events:none;white-space:nowrap}
#ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px}
#ov.on{display:flex}
#ov .box{background:rgba(8,24,14,.95);border:2px solid var(--c,#4ade80);border-radius:20px;padding:20px;max-width:min(92vw,420px);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;animation:pop .45s cubic-bezier(.2,1.5,.4,1);box-shadow:0 0 30px color-mix(in srgb,var(--c,#4ade80) 40%,transparent)}
#ov img{height:clamp(110px,24vh,190px);image-rendering:pixelated;filter:drop-shadow(0 0 16px var(--c));animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
#ov h2{font-family:var(--px);font-size:14px;color:var(--c)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:640px){#wild{left:62%;top:36%;width:54vmin;height:54vmin}#trainer{bottom:30%;width:34vmin}#judge{left:50%;top:22%;font-size:12px}#acts{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){#trainer,#tap,#ov img{animation:none}*{transition:none!important}}
</style>
</head>

</div>

let AC=null;function snd(k){try{if(parent.MUS&&parent.MUS.on===false)return;AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;

function genMap(){
 M.fill(T.GR);
 // floresta ao norte
 for(let y=0;y<17;y++)for(let x=0;x<MW;x++)if(hsh(x,y,1)<.42+(17-y)*.02)set(x,y,T.TR);
 // vulcão a leste
 for(let y=0;y<MH;y++)for(let x=44;x<MW;x++)set(x,y,hsh(x,y,2)<.05?T.RO:T.AS);
 blob(53,19,4.5,3.2,(x,y)=>set(x,y,T.LV));blob(57,33,3.2,2.4,(x,y)=>set(x,y,T.LV));blob(49,40,2.2,1.6,(x,y)=>set(x,y,T.LV));
 // lago a oeste

 // flores e pedras no campo
 for(let i=0;i<70;i++){const x=Math.floor(hsh(i,1,3)*MW),y=17+Math.floor(hsh(i,2,3)*(MH-17));if(at(x,y)===T.GR)set(x,y,hsh(i,3,3)<.85?T.FL:T.RO)}
 // trilhas
 const P=(x,y)=>{const t=at(x,y);if(t!==T.WA&&t!==T.LV)set(x,y,T.PA)};
 line(32,47,32,30,1,P);line(32,30,32,10,0,P);line(32,30,24,27,0,P);line(24,27,24,24,0,P);line(32,30,44,30,0,P);line(44,30,50,26,0,P);line(32,14,22,10,0,P);line(32,14,42,8,0,P);
 for(const [x,y] of [[22,10],[42,8],[32,8]])blob(x,y,3,2.2,(a,b)=>{if(at(a,b)===T.TR)set(a,b,T.GR)});
 // capim alto (onde aparecem os Numius)

 [[9,15,3,2],[22,17,3,2.5],[6,33,3,2.2],[20,35,3.5,2],[25,21,2,3],[49,13,3,2.5],[58,24,3,3],[48,35,3.5,2.5],[59,42,3,2],[22,7,2.5,1.8],[42,6,2.5,1.6],[33,6,2,1.5],[12,5,2,2],[36,22,3,2.4],[26,40,3,2.4],[38,40,3.2,2.2],[40,16,2.5,2]].forEach(([x,y,a,b])=>blob(x,y,a,b,tg));
