<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zona Safari</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--px:'Press Start 2P',monospace;--mono:'JetBrains Mono',ui-monospace,monospace;--ac:#86efac}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1a10;color:#fff;font-family:var(--mono);-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#world{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 12px;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
.btn{padding:9px 14px;border-radius:12px;background:#0b1a10d9;border:2px solid #ffffff33;font-weight:800;font-size:12px;letter-spacing:.04em;box-shadow:0 3px 0 #0008;min-height:40px}
.btn.go{background:linear-gradient(180deg,#d9f99d,#4ade80);color:#052e16;border-color:#fff8}
.ttl{font-family:var(--px);font-size:clamp(10px,1.8vh,14px);color:#d9f99d;text-shadow:0 2px 0 #000,0 0 12px #4ade80;margin-left:10px;align-self:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;background:#0b1a10d9;border:1px solid #ffffff2a;font-size:12px;font-weight:800;white-space:nowrap}
#toast{position:fixed;left:50%;top:64px;transform:translate(-50%,-10px);padding:8px 16px;border-radius:12px;background:#0b1a10e6;border:2px solid var(--ac);font-family:var(--px);font-size:10px;opacity:0;transition:opacity .35s,transform .35s;z-index:6;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#pad{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:4px;z-index:5}
#pad button{border-radius:14px;background:#0b1a10b3;border:2px solid #ffffff40;font-size:22px;box-shadow:0 3px 0 #0008;touch-action:none}
#pad button.on{background:#4ade80aa}
#hint{position:fixed;right:14px;bottom:14px;font-size:11px;color:#d9f99dcc;background:#0b1a10b3;padding:6px 10px;border-radius:10px;z-index:5}
@media(max-width:640px){#hint{display:none}.ttl{display:none}}
/* ---------- encontro ---------- */
#wipe{position:fixed;inset:0;z-index:30;pointer-events:none;display:none}
#wipe i{position:absolute;left:0;right:0;height:12.5%;background:#000}
#enc{position:fixed;inset:0;z-index:20;display:none;overflow:hidden}
#enc.on{display:block}
#ebg{position:absolute;inset:0}
.plat{position:absolute;border-radius:50%;background:radial-gradient(ellipse,#0006,#0000 70%)}
#wild{position:absolute;left:62%;top:36%;width:min(34vmin,280px);height:min(34vmin,280px);transform:translate(-50%,-50%)}
#wild img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 8px 10px #0008);animation:idle 2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes idle{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3%) scale(1.02,.98)}}
#wild.flee img{animation:flee .7s ease-in forwards}
@keyframes flee{to{transform:translateX(160%) translateY(-10%) scale(.6);opacity:0}}
#wild.bond img{animation:bond 1.2s ease-in-out forwards}
@keyframes bond{40%{filter:brightness(3) drop-shadow(0 0 30px #fff)}100%{filter:brightness(1.2) drop-shadow(0 0 20px #fde68a);transform:scale(1.08)}}
#rc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#trainer{position:absolute;left:4%;bottom:26%;width:min(30vmin,240px);aspect-ratio:932/(4*380);height:auto;background-repeat:no-repeat;background-size:400% 100%;filter:drop-shadow(0 6px 10px #0009)}
.card{position:absolute;border-radius:14px;background:#0b1a10e6;border:2px solid #ffffff30;padding:10px 12px;font-size:12px;line-height:1.45}
#info{left:50%;top:12px;transform:translateX(-50%);min-width:min(92vw,340px);text-align:center}
#info b{font-family:var(--px);font-size:12px}
.meter{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:10px;font-weight:800;letter-spacing:.06em}
.meter .bar{flex:1;height:10px;border-radius:99px;background:#0008;border:1px solid #000;overflow:hidden}
.meter .bar i{display:block;height:100%;transition:width .45s}
#bondb i{background:linear-gradient(90deg,#f9a8d4,#fde68a)}
#agib i{background:linear-gradient(90deg,#fbbf24,#ef4444)}
#panel{left:50%;bottom:12px;transform:translateX(-50%);width:min(96vw,720px);display:flex;flex-direction:column;gap:8px}
#emsg{min-height:20px;font-size:13px}
#acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#acts button{padding:10px 6px;border-radius:12px;border:2px solid #ffffff33;background:#ffffff12;font-weight:800;font-size:11px;min-height:54px;display:flex;flex-direction:column;align-items:center;gap:3px}
#acts button span{font-size:20px}
#acts button.main{background:linear-gradient(180deg,#fbcfe8,#f472b6);color:#3b0a24;border-color:#fff8}
#tap{display:none;padding:16px;border-radius:14px;background:linear-gradient(180deg,#fde68a,#f59e0b);color:#3b2506;font-family:var(--px);font-size:14px;border:2px solid #fff;box-shadow:0 4px 0 #0009}
#tap.on{display:block}
#judge{position:absolute;left:62%;top:14%;transform:translateX(-50%);white-space:nowrap;font-family:var(--px);font-size:clamp(12px,2.6vh,20px);text-shadow:0 2px 0 #000;pointer-events:none}
#ov{position:fixed;inset:0;z-index:40;background:#000b;display:none;align-items:center;justify-content:center;padding:16px}
#ov.on{display:flex}
#ov .box{background:#0b1a10;border:2px solid var(--c,#4ade80);border-radius:18px;padding:20px;max-width:min(92vw,420px);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
#ov img{height:clamp(110px,24vh,190px);image-rendering:pixelated;filter:drop-shadow(0 0 16px var(--c))}
#ov h2{font-family:var(--px);font-size:14px;color:var(--c)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:640px){#wild{left:62%;top:34%;width:52vmin;height:52vmin}#trainer{bottom:30%;width:36vmin}#judge{left:50%;top:22%;font-size:12px}#acts{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){#wild img{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<canvas id="world" aria-label="Mapa da Zona Safari"></canvas>
<div class="hud"><div style="display:flex;align-items:center"><button class="btn" id="back" aria-label="Voltar ao mapa">← VOLTAR</button><span class="ttl">ZONA SAFARI</span></div><div class="chips" id="chips"></div></div>
<div id="toast" role="status"></div>
<div id="pad" aria-label="Direcional"><span></span><button data-d="up" aria-label="Andar para cima">▲</button><span></span><button data-d="left" aria-label="Andar para a esquerda">◀</button><span></span><button data-d="right" aria-label="Andar para a direita">▶</button><span></span><button data-d="down" aria-label="Andar para baixo">▼</button><span></span></div>
<div id="hint">Setas ou WASD para andar · o capim alto esconde Numius</div>
<div id="enc" role="dialog" aria-modal="true" aria-label="Encontro selvagem">
 <div id="ebg"></div>
 <div class="plat" id="p1"></div><div class="plat" id="p2"></div>
 <div id="trainer" role="img" aria-label="Você"></div>
 <div id="wild"><img id="wimg" alt=""></div>
 <canvas id="rc"></canvas>
 <div id="judge" aria-live="assertive"></div>
 <div class="card" id="info"></div>
 <div class="card" id="panel"><div id="emsg" aria-live="polite"></div><div id="acts"></div><button id="tap">TOQUE NO RITMO!</button></div>
</div>
<div id="wipe"></div>
<div id="ov" role="dialog" aria-modal="true"></div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s),post=o=>{try{parent.postMessage(Object.assign({numius:1},o),'*')}catch(e){}};
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TR={m:'assets/screens/trainer-m.webp',f:'assets/screens/trainer-f.webp'};
const TE={Fogo:'🔥',Água:'💧',Planta:'🍃',Elétrico:'⚡',Pedra:'🪨',Gelo:'❄️',Psíquico:'🔮',Voador:'🪶',Dragão:'🐉',Normal:'◎'};
const SKF=['brightness(1.12) contrast(1.05)','brightness(1.02) contrast(1.02)','brightness(0.92) sepia(0.18) contrast(1.1)','brightness(0.82) sepia(0.25) contrast(1.15)'];
let D=null,IM={},hero={g:'f',skin:1,hair:0,name:'Você'};
const VISIT={steps:500,fruits:10};let V={steps:500,fruits:10,caught:0};

/* ---------- som ---------- */
let AC=null;function snd(k){try{if(parent.MUS&&parent.MUS.on===false)return;AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
 const tone=(f,d,ty,v,at)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,t+(at||0));g.gain.setValueAtTime(v||.06,t+(at||0));g.gain.exponentialRampToValueAtTime(.0001,t+(at||0)+d);o.connect(g).connect(AC.destination);o.start(t+(at||0));o.stop(t+(at||0)+d+.02)};
 if(k==='enc'){[523,659,784,1046].forEach((f,i)=>tone(f,.12,'square',.05,i*.07))}
 else if(k==='beat')tone(880,.05,'sine',.05);
 else if(k==='perf'){tone(1318,.12,'triangle',.07);tone(1760,.12,'triangle',.05,.06)}
 else if(k==='good')tone(988,.1,'triangle',.06);
 else if(k==='miss')tone(180,.18,'sawtooth',.05);
 else if(k==='bond'){[523,659,784,1046,1318].forEach((f,i)=>tone(f,.25,'triangle',.06,i*.11))}
 else if(k==='flee'){tone(600,.25,'sawtooth',.04);tone(300,.25,'sawtooth',.04,.1)}
 else if(k==='fruit'){tone(660,.08,'sine',.06);tone(990,.1,'sine',.05,.08)}
}catch(e){}}

/* ---------- mundo ---------- */
const TS=16,MW=64,MH=48;
const T={GR:0,TG:1,PA:2,WA:3,SA:4,TR:5,RO:6,FL:7,AS:8,LV:9,AG:10,FE:11};
const SOLID=new Set([T.WA,T.TR,T.RO,T.LV,T.FE]);
const REG={lago:{n:'🌊 Lago Espelhado',fam:0,sky:['#7dd3fc','#bae6fd','#2563eb'],gr:'#5fae63'},vulcao:{n:'🌋 Campo Vulcânico',fam:1,sky:['#451a03','#9a3412','#1c0a05'],gr:'#5a4a44'},floresta:{n:'🌲 Floresta Antiga',fam:2,sky:['#14532d','#4d7c0f','#052e16'],gr:'#3f7d3a'},campo:{n:'🌼 Campina Central',fam:-1,sky:['#a7f3d0','#fef9c3','#65a30d'],gr:'#6cc04a'}};
let seed=1337;const rnd=()=>{seed=(seed*1103515245+12345)>>>0;return (seed>>>8)/16777216};
const hsh=(x,y,s)=>{let h=(x*374761393+y*668265263+(s||0)*2147483647)>>>0;h=(h^(h>>>13))*1274126177>>>0;return((h^(h>>>16))>>>0)/4294967296};
const M=new Uint8Array(MW*MH);const at=(x,y)=>x<0||y<0||x>=MW||y>=MH?T.TR:M[y*MW+x];const set=(x,y,v)=>{if(x>=0&&y>=0&&x<MW&&y<MH)M[y*MW+x]=v};
const LAKE={x:14,y:25,rx:9,ry:7};
function regionAt(x,y){const dx=(x-LAKE.x)/(LAKE.rx+5),dy=(y-LAKE.y)/(LAKE.ry+5);if(dx*dx+dy*dy<1)return'lago';if(x>43)return'vulcao';if(y<17)return'floresta';return'campo'}
function blob(cx,cy,rx,ry,f){for(let y=Math.floor(cy-ry-1);y<=cy+ry+1;y++)for(let x=Math.floor(cx-rx-1);x<=cx+rx+1;x++){const n=((x-cx)/rx)**2+((y-cy)/ry)**2+(hsh(x,y,7)-.5)*.35;if(n<1)f(x,y)}}
function line(x0,y0,x1,y1,w,f){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0));for(let i=0;i<=n;i++){const x=Math.round(x0+(x1-x0)*i/n),y=Math.round(y0+(y1-y0)*i/n);for(let a=-w;a<=w;a++)for(let b=-w;b<=w;b++)f(x+a,y+b)}}
function genMap(){
 M.fill(T.GR);
 // floresta ao norte
 for(let y=0;y<17;y++)for(let x=0;x<MW;x++)if(hsh(x,y,1)<.42+(17-y)*.02)set(x,y,T.TR);
 // vulcão a leste
 for(let y=0;y<MH;y++)for(let x=44;x<MW;x++)set(x,y,hsh(x,y,2)<.05?T.RO:T.AS);
 blob(53,19,4.5,3.2,(x,y)=>set(x,y,T.LV));blob(57,33,3.2,2.4,(x,y)=>set(x,y,T.LV));blob(49,40,2.2,1.6,(x,y)=>set(x,y,T.LV));
 // lago a oeste
 blob(LAKE.x,LAKE.y,LAKE.rx+1.8,LAKE.ry+1.8,(x,y)=>set(x,y,T.SA));blob(LAKE.x,LAKE.y,LAKE.rx,LAKE.ry,(x,y)=>set(x,y,T.WA));
 // flores e pedras no campo
 for(let i=0;i<70;i++){const x=Math.floor(hsh(i,1,3)*MW),y=17+Math.floor(hsh(i,2,3)*(MH-17));if(at(x,y)===T.GR)set(x,y,hsh(i,3,3)<.85?T.FL:T.RO)}
 // trilhas
 const P=(x,y)=>{const t=at(x,y);if(t!==T.WA&&t!==T.LV)set(x,y,T.PA)};
 line(32,47,32,30,1,P);line(32,30,32,10,0,P);line(32,30,24,27,0,P);line(24,27,24,24,0,P);line(32,30,44,30,0,P);line(44,30,50,26,0,P);line(32,14,22,10,0,P);line(32,14,42,8,0,P);
 for(const [x,y] of [[22,10],[42,8],[32,8]])blob(x,y,3,2.2,(a,b)=>{if(at(a,b)===T.TR)set(a,b,T.GR)});
 // capim alto (onde aparecem os Numius)
 const tg=(x,y)=>{const t=at(x,y);if(t===T.GR||t===T.FL)set(x,y,T.TG);else if(t===T.AS)set(x,y,T.AG);else if(t===T.SA&&hsh(x,y,9)<.6)set(x,y,T.TG)};
 [[9,15,3,2],[22,17,3,2.5],[6,33,3,2.2],[20,35,3.5,2],[25,21,2,3],[49,13,3,2.5],[58,24,3,3],[48,35,3.5,2.5],[59,42,3,2],[22,7,2.5,1.8],[42,6,2.5,1.6],[33,6,2,1.5],[12,5,2,2],[36,22,3,2.4],[26,40,3,2.4],[38,40,3.2,2.2],[40,16,2.5,2]].forEach(([x,y,a,b])=>blob(x,y,a,b,tg));
 // bordas e cerca da entrada
 for(let x=0;x<MW;x++){set(x,0,T.TR);set(x,1,T.TR);set(x,MH-1,T.TR);set(x,MH-2,T.TR)}for(let y=0;y<MH;y++){set(0,y,T.TR);set(1,y,T.TR);set(MW-1,y,T.TR);set(MW-2,y,T.TR)}
 for(let x=26;x<=38;x++)if(x<30||x>34)set(x,45,T.FE);for(let x=31;x<=33;x++){set(x,46,T.PA);set(x,47,T.PA)}set(30,45,T.FE);set(34,45,T.FE);
}
/* desenho do mapa estático (pixel art procedural) */
let MAP=null;
function px(c,col,x,y,w,h){c.fillStyle=col;c.fillRect(x,y,w||1,h||1)}
function drawTile(c,x,y,t){const X=x*TS,Y=y*TS,r=(a)=>hsh(x,y,a);
 const grass=(b,d,l)=>{px(c,b,X,Y,TS,TS);for(let i=0;i<7;i++)px(c,d,X+Math.floor(r(10+i)*15),Y+Math.floor(r(20+i)*15),1,2);for(let i=0;i<3;i++)px(c,l,X+Math.floor(r(30+i)*15),Y+Math.floor(r(40+i)*15))};
 const reg=regionAt(x,y);
 if(t===T.GR||t===T.TG||t===T.FL){if(reg==='floresta')grass('#4f9a45','#3f8238','#7cc36a');else if(reg==='lago')grass('#64b56a','#4f9a57','#93d68f');else grass('#6cc04a','#58a83c','#a3e07a')}
 if(t===T.FL){const cs=['#f472b6','#fde047','#ffffff','#a78bfa'];for(let i=0;i<3;i++){const fx=X+3+Math.floor(r(50+i)*10),fy=Y+3+Math.floor(r(60+i)*10),cl=cs[Math.floor(r(70+i)*4)];px(c,cl,fx,fy,2,2);px(c,'#fef08a',fx,fy)}}
 if(t===T.PA){px(c,'#d8b878',X,Y,TS,TS);for(let i=0;i<6;i++)px(c,'#c19a5b',X+Math.floor(r(10+i)*15),Y+Math.floor(r(20+i)*15),2,1);for(let i=0;i<3;i++)px(c,'#efd9a6',X+Math.floor(r(30+i)*15),Y+Math.floor(r(40+i)*15))}
 if(t===T.SA){px(c,'#ecd9a0',X,Y,TS,TS);for(let i=0;i<6;i++)px(c,'#d6bf82',X+Math.floor(r(10+i)*15),Y+Math.floor(r(20+i)*15))}
 if(t===T.WA){px(c,'#3b8fd8',X,Y,TS,TS);px(c,'#3584cb',X,Y+8,TS,8);const n=(a,b)=>at(x+a,y+b)!==T.WA;if(n(0,-1))px(c,'#e0f2fe',X,Y,TS,2);if(n(-1,0))px(c,'#bfe3fb',X,Y,2,TS);if(n(1,0))px(c,'#bfe3fb',X+14,Y,2,TS);if(n(0,1))px(c,'#2b6cb0',X,Y+14,TS,2)}
 if(t===T.AS||t===T.AG){px(c,'#4a3f3c',X,Y,TS,TS);for(let i=0;i<8;i++)px(c,r(80+i)<.5?'#5d504b':'#3a302e',X+Math.floor(r(10+i)*15),Y+Math.floor(r(20+i)*15),2,1);if(r(99)<.15)px(c,'#f97316',X+Math.floor(r(98)*14),Y+Math.floor(r(97)*14))}
 if(t===T.LV){px(c,'#2a1a16',X,Y,TS,TS)}
 if(t===T.TR){const b=reg==='vulcao'?'#4a3f3c':'#3f7d3a';px(c,b,X,Y,TS,TS);px(c,'#5b3a1e',X+6,Y+10,4,6);px(c,'#1f5a2a',X+1,Y+1,14,11);px(c,'#2f7a36',X+2,Y+1,11,9);px(c,'#4caa4a',X+4,Y+2,6,4);px(c,'#7fd36b',X+5,Y+2,2,2);px(c,'#163f1f',X+1,Y+11,14,1)}
 if(t===T.RO){px(c,'#a3a3a3',X+3,Y+5,10,9);px(c,'#d4d4d4',X+4,Y+5,6,3);px(c,'#737373',X+3,Y+12,10,2);px(c,'#00000040',X+2,Y+14,12,2)}
 if(t===T.FE){px(c,'#6cc04a',X,Y,TS,TS);px(c,'#8b5a2b',X,Y+5,TS,3);px(c,'#8b5a2b',X,Y+10,TS,3);px(c,'#6b4220',X+2,Y+2,3,13);px(c,'#6b4220',X+11,Y+2,3,13);px(c,'#a87440',X+2,Y+2,3,1)}
}
function buildMap(){MAP=document.createElement('canvas');MAP.width=MW*TS;MAP.height=MH*TS;const c=MAP.getContext('2d');for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)drawTile(c,x,y,at(x,y));
 // placa da entrada
 px(c,'#6b4220',31*TS+6,43*TS,2,20);px(c,'#6b4220',33*TS+8,43*TS,2,20);px(c,'#8b5a2b',30*TS+12,42*TS+2,TS*3+10,13);px(c,'#a87440',30*TS+12,42*TS+2,TS*3+10,2);
 c.fillStyle='#fef3c7';c.font='bold 8px monospace';c.textAlign='center';c.fillText('SAFARI',32*TS+8,42*TS+12)}
/* ---------- personagem (pixel art procedural, 4 direções) ---------- */
const HAIR={m:['#1c1c22','#7a4a22','#3b6fd1','#e5e7eb'],f:['#e8c84a','#1c1c22','#8b5a2b','#4a8acc']};
const SKIN=['#f5d0a0','#e8b888','#c6865a','#8d5a3a'];
let SPR={};
function buildHero(){
 const g=hero.g==='m'?'m':'f',hi=Math.max(0,Math.min(3,hero.hair|0)),hair=HAIR[g][hi],hd=shade(hair,-.3),skin=SKIN[Math.max(0,Math.min(3,hero.skin|0))],sk2=shade(skin,-.15);
