        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap');
        * { box-sizing: border-box; }
        :root {
          --safe-area-inset-top: env(safe-area-inset-top, 0px);
          --accent: ${P.color};
          --accent-shadow: ${P.shadow};
        }
        html, body { margin:0; padding:0; overflow:hidden; }
        .elfaria-root {
          width: 100vw;
          height: 100vh;
          height: 100dvh;
          background: radial-gradient(120% 80% at 50% -10%, #2a245f 0%, #1e1840 25%, #12102a 55%, #0a0a12 100%);
          position: relative;
          display: flex;
          flex-direction: column;
          overflow: hidden;
          overflow-x: clip;
          padding-top: var(--safe-area-inset-top);
          font-family: 'VT323', monospace;
        }

        /* stars */
        .stars {
          position: absolute;
          inset:0;
          pointer-events:none;
          background-image: 
            radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,0.9) 0, transparent 100%),
            radial-gradient(1.5px 1.5px at 30% 12%, rgba(255,255,255,0.7) 0, transparent 100%),
            radial-gradient(1px 1px at 45% 18%, rgba(255,255,255,0.6) 0, transparent 100%),
            radial-gradient(1.2px 1.2px at 70% 8%, rgba(255,255,255,0.8) 0, transparent 100%),
            radial-gradient(1px 1px at 85% 25%, rgba(255,255,255,0.5) 0, transparent 100%),
            radial-gradient(1.5px 1.5px at 10% 45%, rgba(255,255,255,0.6) 0, transparent 100%),
            radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.7) 0, transparent 100%),
            radial-gradient(1px 1px at 25% 70%, rgba(255,255,255,0.4) 0, transparent 100%),
            radial-gradient(1.3px 1.3px at 60% 75%, rgba(255,255,255,0.5) 0, transparent 100%);
          opacity:0.9;
          animation: twinkle 6s ease-in-out infinite alternate;
        }
        @keyframes twinkle {
          0% { opacity:0.6; }
          100% { opacity:1; }
        }

        /* scanline overlay */
        .scanline {
          position:absolute;
          inset:0;
          background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,0.02) 2px 3px);
          pointer-events:none;
          z-index:2;
        }

        .top-zone {
          height: 24vh;
          min-height: 160px;
          display:flex;
          align-items:flex-end;
          justify-content:center;
          position:relative;
          z-index:3;
          padding-bottom: 10px;
        }

        .professor-wrap {
          position:relative;
          display:flex;
          flex-direction:column;
          align-items:center;
          animation: professorEntrance 1.1s cubic-bezier(0.16,1,0.3,1) forwards;
          transform-origin: bottom center;
        }
        @keyframes professorEntrance {
          0% { transform: translateY(110px) scale(0.78); opacity:0; }
          60% { transform: translateY(-8px) scale(1.04); opacity:1; }
          100% { transform: translateY(0) scale(1); opacity:1; }
        }
        .professor-img-inner {
          animation: armsOpen 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.3s both;
          transform-origin: center bottom;
          display:flex;
        }
        @keyframes armsOpen {
          0% { transform: scaleX(0.55) scaleY(0.9); }
          45% { transform: scaleX(1.18) scaleY(1.05); }
          75% { transform: scaleX(0.96) scaleY(0.98); }
          100% { transform: scaleX(1) scaleY(1); }
        }

        .professor-img {
          height: 19vh;
          min-height: 135px;
          max-height: 210px;
          width:auto;
          object-fit:contain;
          filter: drop-shadow(0 12px 24px rgba(0,0,0,0.6)) drop-shadow(0 0 18px rgba(120,110,255,0.35));
          image-rendering: auto;
        }

        .speech-bubble {
          position: relative;
          background: #f5f2e8;
          border: 4px solid #1a1a1a;
          border-radius: 18px;
          padding: 14px 22px 12px;
          margin-bottom: 18px;
          max-width: min(560px, 92vw);
          box-shadow: 
            0 0 0 4px rgba(255,255,255,0.12),
            0 8px 0 #1a1a1a,
            0 14px 28px rgba(0,0,0,0.45),
            inset 0 -3px 0 rgba(0,0,0,0.1);
          transform: ${e?"translateY(0) scale(1)":"translateY(14px) scale(0.92)"};
          opacity: ${e?"1":"0"};
          transition: all 0.6s cubic-bezier(0.16,1,0.3,1) 0.7s;
        }
        .speech-bubble::after {
          content:'';
          position:absolute;
          bottom:-18px;
          left:50%;
          transform: translateX(-50%);
          width:22px;
          height:18px;
          background:#f5f2e8;
          border-right:4px solid #1a1a1a;
          border-bottom:4px solid #1a1a1a;
          clip-path: polygon(0 0, 100% 0, 50% 100%);
        }
        .speech-bubble::before {
          content:'';
          position:absolute;
          bottom:-26px;
          left:50%;
          transform: translateX(-50%);
          width:22px;
          height:10px;
          background:#1a1a1a;
          clip-path: polygon(0 0, 100% 0, 50% 100%);
        }
        .speech-text {
          font-family: 'Silkscreen', 'Press Start 2P', monospace;
          font-size: clamp(11px, 1.6vw, 18px);
          line-height: 1.3;
          color:#111;
          text-transform: uppercase;
          letter-spacing: 0.02em;
          text-align:center;
          font-weight:700;
        }
        .speech-text span {
          color: var(--accent);
          text-shadow: 1px 1px 0 #000;
        }

        .middle-zone {
          flex:1;
          display:flex;
          flex-direction:column;
          align-items:center;
          justify-content:center;
          gap: clamp(12px, 2vh, 28px);
          z-index:3;
          padding: 0 24px;
          min-height:0;
        }

        .main-title {
          font-family: 'Press Start 2P', monospace;
          font-size: clamp(14px, 2.6vw, 28px);
          color: #fff;
          text-align:center;
          letter-spacing: 0.08em;
          line-height: 1.25;
          text-shadow: 
            0 0 0 #000,
            3px 3px 0 #000,
            0 0 22px var(--accent-shadow),
            0 0 42px var(--accent-shadow);
          margin:0;
          padding: 6px 0;
          animation: titleGlow 2.5s ease-in-out infinite alternate;
        }
        @keyframes titleGlow {
          0% { text-shadow: 3px 3px 0 #000, 0 0 18px var(--accent-shadow); }
          100% { text-shadow: 3px 3px 0 #000, 0 0 32px var(--accent-shadow), 0 0 56px var(--accent-shadow); }
        }

        .starters-grid {
          display:flex;
          gap: clamp(16px, 4vw, 64px);
          align-items:flex-end;
          justify-content:center;
          padding: 10px 0 14px;
        }

        .starter-card {
          position:relative;
          display:flex;
          flex-direction:column;
          align-items:center;
          cursor:pointer;
          transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), filter 0.35s;
          transform-origin: bottom center;
          outline:none;
          border:none;
          background: transparent;
        }
        .starter-card:hover {
          transform: scale(1.08) translateY(-6px);
        }
        .starter-card.selected {
          transform: scale(1.18) translateY(-12px);
        }
        .starter-card.selected:hover {
          transform: scale(1.20) translateY(-14px);
        }

        .starter-platform {
          position:absolute;
          bottom: 8px;
          width: 110%;
          height: 18px;
          background: radial-gradient(ellipse at center, var(--platform) 0%, transparent 70%);
          border-radius: 50%;
          filter: blur(1px);
          opacity:0.9;
          transition: all 0.4s;
          z-index:0;
        }

        .starter-img {
          position:relative;
          z-index:1;
          height: clamp(110px, 18vh, 210px);
          width:auto;
          max-width: 24vw;
          object-fit:contain;
          filter: drop-shadow(0 14px 18px rgba(0,0,0,0.55)) drop-shadow(0 0 18px var(--platform));
          animation: floaty 3.2s ease-in-out infinite;
          image-rendering: auto;
        }
        .starter-card:nth-child(2) .starter-img { animation-delay: 0.4s; }
        .starter-card:nth-child(3) .starter-img { animation-delay: 0.8s; }
        @keyframes floaty {
          0%,100% { transform: translateY(0); }
          50% { transform: translateY(-10px); }
        }

        .starter-label {
          margin-top: 10px;
          font-family: 'Silkscreen', monospace;
          font-size: clamp(9px, 1.1vw, 13px);
          color: rgba(255,255,255,0.85);
          letter-spacing: 0.18em;
          text-transform: uppercase;
          background: rgba(0,0,0,0.55);
          border: 1px solid rgba(255,255,255,0.15);
          padding: 3px 10px;
          border-radius: 999px;
          backdrop-filter: blur(6px);
          transition: all 0.3s;
          z-index:2;
        }
        .starter-card.selected .starter-label {
          background: var(--platform);
          color:#000;
          border-color: var(--platform);
          box-shadow: 0 0 16px var(--platform);
          font-weight:700;
        }

        .selector-ring {
          position:absolute;
          bottom: -6px;
          width: 72px;
          height: 72px;
          border: 3px dashed var(--platform);
          border-radius: 50%;
          opacity:0;
          transform: scale(0.7) rotate(0deg);
          transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
          z-index:0;
          animation: ringSpin 8s linear infinite;
        }
        .starter-card.selected .selector-ring {
          opacity:0.9;
          transform: scale(1.35) rotate(180deg);
        }
        @keyframes ringSpin {
          to { transform: scale(1.35) rotate(360deg); }
        }

        /* Bottom HUD */
        .bottom-hud {
          height: 30vh;
          min-height: 200px;
          max-height: 320px;
          width:100%;
          background: 
            linear-gradient(180deg, rgba(20,16,40,0.92) 0%, rgba(10,8,22,0.98) 100%),
            radial-gradient(80% 120% at 20% 0%, var(--accent) 0%, transparent 60%);
          background-blend-mode: normal, screen;
          border-top: 3px solid var(--accent);
          box-shadow: 
            0 -2px 0 rgba(255,255,255,0.08) inset,
            0 -18px 42px color-mix(in srgb, var(--accent) 32%, transparent),
            0 -1px 0 var(--accent);
          border-radius: 22px 22px 0 0;
          position:relative;
          z-index:5;
          display:flex;
          overflow:hidden;
          backdrop-filter: blur(18px);
          transition: border-color 0.5s, box-shadow 0.5s, background 0.5s;
        }
        .bottom-hud::before {
          content:'';
          position:absolute;
          top:0;
          left:0;
          right:0;
          height:2px;
          background: linear-gradient(90deg, transparent, var(--accent), transparent);
          opacity:0.9;
        }
        .hud-glow {
          position:absolute;
          left: -10%;
          top: -40%;
          width: 50%;
          height: 140%;
          background: radial-gradient(ellipse at center, var(--accent) 0%, transparent 70%);
          opacity:0.22;
          filter: blur(18px);
          pointer-events:none;
          transition: background 0.5s;
        }

        .hud-content {
          display:flex;
          width:100%;
          height:100%;
          position:relative;
          z-index:1;
          padding: 18px clamp(18px, 3vw, 36px);
          gap: clamp(16px, 2.5vw, 28px);
        }

        .hud-left {
          display:flex;
          gap: 18px;
          flex:1;
          min-width:0;
        }
        .hud-portrait {
          width: clamp(86px, 9vw, 128px);
          height: clamp(86px, 9vw, 128px);
          border-radius: 16px;
          background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(0,0,0,0.4));
          border: 2px solid var(--accent);
          box-shadow: 0 0 0 1px rgba(255,255,255,0.1) inset, 0 8px 20px rgba(0,0,0,0.5), 0 0 22px color-mix(in srgb, var(--accent) 40%, transparent);
          display:flex;
          align-items:center;
          justify-content:center;
          overflow:hidden;
          position:relative;
          flex-shrink:0;
        }
        .hud-portrait img {
          width: 92%;
          height: 92%;
          object-fit:contain;
          filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
        }

        .hud-info {
          flex:1;
          display:flex;
          flex-direction:column;
          gap: 8px;
          min-width:0;
        }
        .hud-type-row {
          display:flex;
          align-items:center;
          gap: 10px;
        }
        .hud-type {
          font-family: 'Press Start 2P', monospace;
          font-size: 9px;
          letter-spacing:0.12em;
          padding: 6px 10px;
          border-radius: 6px;
          background: var(--accent);
          color:#000;
          box-shadow: 0 2px 0 #000;
        }
        .hud-trait {
          font-family: 'Silkscreen', monospace;
          font-size: 12px;
          letter-spacing:0.12em;
          color: rgba(255,255,255,0.7);
          border: 1px dashed rgba(255,255,255,0.2);
          padding: 3px 8px;
          border-radius: 999px;
        }
        .hud-name {
          font-family: 'Press Start 2P', monospace;
          font-size: clamp(14px, 1.8vw, 22px);
          color:#fff;
          text-shadow: 2px 2px 0 #000;
          line-height:1.1;
          margin: 2px 0 0;
        }
        .hud-desc {
          font-family: 'VT323', monospace;
          font-size: clamp(15px, 1.35vw, 19px);
          line-height:1.25;
          color: rgba(255,255,255,0.82);
          max-width: 560px;
          margin-top:2px;
        }

        .hud-stats {
          display:flex;
          gap: 14px;
          margin-top: 6px;
          flex-wrap:wrap;
        }
        .stat {
          display:flex;
          flex-direction:column;
          gap:2px;
          min-width: 52px;
        }
        .stat-label {
          font-family: 'Silkscreen', monospace;
          font-size: 10px;
          letter-spacing:0.15em;
          color: rgba(255,255,255,0.5);
        }
        .stat-bar {
          height:6px;
          width: 64px;
          background: rgba(255,255,255,0.12);
          border-radius: 999px;
          overflow:hidden;
          border: 1px solid rgba(255,255,255,0.08);
        }
        .stat-fill {
          height:100%;
          background: var(--accent);
          box-shadow: 0 0 8px var(--accent);
          border-radius:999px;
          transition: width 0.6s cubic-bezier(0.16,1,0.3,1);
        }
        .stat-val {
          font-family: 'VT323', monospace;
          font-size: 14px;
          color:#fff;
        }

        .hud-right {
          display:flex;
          flex-direction:column;
          align-items:stretch;
          justify-content:center;
          gap: 14px;
          width: clamp(180px, 20vw, 260px);
          flex-shrink:0;
        }

        .confirm-btn {
          font-family: 'Press Start 2P', monospace;
          font-size: clamp(11px, 1.15vw, 13px);
          letter-spacing:0.06em;
          padding: 18px 18px;
          border-radius: 12px;
          border: 3px solid #000;
          background: var(--accent);
          color:#000;
          cursor:pointer;
