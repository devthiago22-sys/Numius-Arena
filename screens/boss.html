<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boss semanal</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bc:#ffd54a;--bc2:#fff3b0;--ink:#f5f3ff;--mut:#9ca3af;--panel:rgba(16,14,32,.82);--line:rgba(255,255,255,.12);--px:'Press Start 2P',monospace;--mono:'JetBrains Mono',ui-monospace,monospace}
html,body{width:100%;height:100%;overflow:hidden;background:#07060f;color:var(--ink);font-family:var(--mono);-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:default;opacity:.45}
#app{position:relative;width:100%;height:100dvh;overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.hidden{display:none!important}
.px{font-family:var(--px)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:clamp(10px,1.5vh,13px);font-weight:700;white-space:nowrap}
.btn{padding:clamp(8px,1.6vh,14px) clamp(12px,2vw,22px);border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:800;font-size:clamp(11px,1.7vh,14px);letter-spacing:.04em;transition:transform .12s,background .2s,box-shadow .2s}
.btn:hover:not(:disabled){transform:translateY(-1px);background:rgba(255,255,255,.14)}
.btn.go{background:linear-gradient(180deg,var(--bc2),var(--bc));color:#1a1206;border-color:#fff8;box-shadow:0 0 22px color-mix(in srgb,var(--bc) 60%,transparent),0 5px 0 rgba(0,0,0,.45);font-family:var(--px);font-size:clamp(10px,1.8vh,14px);letter-spacing:.02em}
.btn.go:hover:not(:disabled){box-shadow:0 0 34px var(--bc),0 5px 0 rgba(0,0,0,.45)}
/* ---------- lobby ---------- */
#lobby{padding:clamp(8px,1.6vh,18px) clamp(10px,2.4vw,32px);gap:clamp(8px,1.4vh,16px)}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.top .l{display:flex;align-items:center;gap:12px}
.ttl{font-family:var(--px);font-size:clamp(11px,2.2vh,18px);color:var(--bc);text-shadow:0 2px 0 #000,0 0 18px var(--bc)}
.lob{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(10px,2vw,28px)}
.show{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.show .hero{position:relative;height:100%;max-height:62vh;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.show canvas.dr{position:absolute;left:-6%;top:-6%;width:112%;height:112%;z-index:2;filter:drop-shadow(0 0 28px color-mix(in srgb,var(--bc) 70%,transparent))}
.halo{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--bc) 45%,transparent),transparent 66%);animation:halo 3.4s ease-in-out infinite}
.rays{position:absolute;left:50%;top:50%;width:150%;height:150%;border-radius:50%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--bc) 30%,transparent) 0 5deg,transparent 5deg 22deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 58%);mask-image:radial-gradient(circle,#000 0,transparent 58%);animation:spin 40s linear infinite;opacity:.55}
.bname{text-align:center;margin-top:4px}
.bname h1{font-family:var(--px);font-size:clamp(16px,4.4vh,34px);color:var(--bc);text-shadow:0 3px 0 #000,0 0 26px var(--bc);letter-spacing:.04em}
.bname p{font-size:clamp(10px,1.7vh,14px);color:var(--bc2);opacity:.9;margin-top:4px}
.pan{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(6px);overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:clamp(8px,1.5vh,13px) 6px;font-weight:800;font-size:clamp(10px,1.6vh,13px);letter-spacing:.06em;color:var(--mut);border-bottom:3px solid transparent}
.tab.on{color:var(--bc2);border-color:var(--bc);background:color-mix(in srgb,var(--bc) 10%,transparent)}
.tb{flex:1;min-height:0;overflow:auto;padding:clamp(8px,1.6vh,16px);display:flex;flex-direction:column;gap:clamp(8px,1.4vh,14px)}
.sec{font-size:clamp(9px,1.4vh,11px);letter-spacing:.14em;color:var(--mut);font-weight:800}
.party{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{aspect-ratio:.8;border-radius:12px;border:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:rgba(255,255,255,.04);font-size:clamp(8px,1.3vh,11px);text-align:center;padding:2px}
.slot.me{border:2px solid var(--bc);background:color-mix(in srgb,var(--bc) 14%,transparent);box-shadow:0 0 16px color-mix(in srgb,var(--bc) 45%,transparent)}
.slot .em{font-size:clamp(18px,4vh,34px)}
.slot img{width:78%;height:46%;object-fit:contain}
.slot canvas{width:96%;height:58%;display:block}
.picks{display:flex;gap:6px;flex-wrap:wrap}
.pk{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:clamp(9px,1.4vh,12px);font-weight:700}
.pk img{width:clamp(28px,5vh,42px);height:clamp(28px,5vh,42px);object-fit:contain}
.pk.on{border-color:var(--bc);background:color-mix(in srgb,var(--bc) 18%,transparent)}
.mvl{font-size:clamp(9px,1.4vh,12px);line-height:1.5;color:#d1d5db}
.mvl b{color:var(--bc2)}
.card{padding:clamp(8px,1.4vh,12px);border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:clamp(9px,1.45vh,12px);line-height:1.5}
.rw{display:flex;gap:8px;flex-wrap:wrap}
.rwi{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid var(--line);font-weight:800;font-size:clamp(10px,1.6vh,13px)}
.frag{width:16px;height:16px;transform:rotate(45deg) scale(.82);background:linear-gradient(135deg,#fff,var(--fc));border:2px solid #fff9;box-shadow:0 0 10px var(--fc)}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fc{position:relative;padding:8px 6px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);text-align:center;font-size:clamp(9px,1.4vh,11px)}
.fc.cur{border-color:var(--fc);box-shadow:0 0 14px color-mix(in srgb,var(--fc) 50%,transparent)}
.fc img{height:clamp(34px,8vh,64px);object-fit:contain;filter:drop-shadow(0 0 8px var(--fc))}
.fc b{display:block;font-family:var(--px);font-size:clamp(8px,1.3vh,10px);color:var(--fc);margin-top:3px}
.lb{display:flex;flex-direction:column;gap:4px}
.lr{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.05);font-size:clamp(10px,1.5vh,12px)}
.lr.me{border:1px solid var(--bc);background:color-mix(in srgb,var(--bc) 14%,transparent)}
.lr i{font-style:normal;width:22px;font-family:var(--px);font-size:10px;color:var(--bc)}
.lr b{flex:1}
.eggbig{width:46px;height:58px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(circle at 35% 30%,#fff 0,#e9d5ff 22%,#a78bfa 60%,#5b21b6);position:relative;box-shadow:0 0 18px #a78bfa88;flex:none}
.eggbig:before,.eggbig:after{content:'';position:absolute;border-radius:50%;background:#7c3aed88}
.eggbig:before{width:12px;height:12px;left:10px;top:22px}.eggbig:after{width:9px;height:9px;left:26px;top:36px}
/* ---------- batalha ---------- */
#battle{background:#05040c}
#hud{position:relative;z-index:30;display:flex;align-items:center;gap:clamp(8px,2vw,24px);padding:clamp(5px,1vh,10px) clamp(8px,2vw,22px);background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,.35));border-bottom:1px solid var(--line)}
#hud .nm{font-family:var(--px);font-size:clamp(9px,1.8vh,14px);color:var(--bc);text-shadow:0 2px 0 #000;white-space:nowrap}
#bhp{position:relative;flex:1;height:clamp(14px,2.6vh,22px);border-radius:999px;background:#0a0a12;border:2px solid #000;box-shadow:0 0 0 1px var(--line);overflow:hidden}
#bhp .ghost{position:absolute;inset:0 auto 0 0;background:#fff;opacity:.85;transition:width 1s .35s ease-out}
#bhp .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--bc),var(--bc2));box-shadow:0 0 14px var(--bc);transition:width .55s ease-out}
#bhp .sh{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(45deg,#7dd3fc 0 6px,#e0f2fe 6px 12px);opacity:.9;transition:width .4s}
#bhp .nt{position:absolute;top:0;bottom:0;width:2px;background:#000a}
#bhp .tx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(8px,1.4vh,11px);font-weight:800;text-shadow:0 1px 2px #000;letter-spacing:.06em}
#turn{font-size:clamp(9px,1.5vh,12px);font-weight:800;color:var(--mut);white-space:nowrap}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#stage:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,color-mix(in srgb,var(--bc) 24%,#0b0916cc) 0,#0b0916cc 55%,#04030acc 100%)}
#floor{position:absolute;left:-10%;right:-10%;bottom:-18%;height:62%;border-radius:50%;background:radial-gradient(ellipse,color-mix(in srgb,var(--bc) 22%,transparent) 0,transparent 68%);border-top:2px solid color-mix(in srgb,var(--bc) 40%,transparent);transform:perspective(500px) rotateX(58deg)}
#links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
#links path{fill:none;stroke:color-mix(in srgb,var(--bc) 50%,#fff);stroke-width:2;opacity:.22;stroke-dasharray:4 6;transition:opacity .25s,stroke-width .25s}
#links path.on{opacity:1;stroke-width:4;stroke:#fff;filter:drop-shadow(0 0 6px var(--bc));stroke-dasharray:none}
#boss{position:absolute;left:50%;top:3%;height:52%;aspect-ratio:1;transform:translateX(-50%);z-index:3;display:flex;align-items:flex-end;justify-content:center}
#boss .wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#bimg{position:absolute;left:-14%;top:-14%;width:128%;height:128%;z-index:2;filter:drop-shadow(0 0 24px color-mix(in srgb,var(--bc) 65%,transparent));transform-origin:50% 80%}
#boss .aura{position:absolute;inset:-6%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--bc) 68%,transparent),color-mix(in srgb,var(--bc) 22%,transparent) 42%,transparent 66%);animation:halo 3s ease-in-out infinite;z-index:1}
#boss .ring{position:absolute;left:50%;top:50%;width:118%;height:118%;border-radius:50%;z-index:1;transform:translate(-50%,-50%);pointer-events:none}
#boss.charging #bimg{animation:chg .5s ease-in-out infinite alternate}
#boss.charging .aura{animation:halo .5s ease-in-out infinite;background:radial-gradient(circle,#fff8,color-mix(in srgb,var(--bc) 75%,transparent) 30%,transparent 66%)}
.shield{position:absolute;left:50%;top:50%;width:104%;height:104%;transform:translate(-50%,-50%);border-radius:50%;z-index:4;border:3px solid #bae6fd;background:radial-gradient(circle,transparent 58%,#7dd3fc44 100%);box-shadow:0 0 30px #7dd3fc,inset 0 0 40px #7dd3fc66;animation:shd 1.6s ease-in-out infinite;opacity:0;transition:opacity .4s;pointer-events:none}
.shield.on{opacity:1}
.mem{position:absolute;z-index:6;width:clamp(70px,14vh,130px);transform:translate(-50%,-50%);text-align:center;transition:filter .5s,opacity .5s}
.mem .sp{position:relative;width:100%;height:clamp(60px,14vh,122px);display:flex;align-items:flex-end;justify-content:center}
.mem .sp canvas{position:absolute;left:-35%;top:-40%;width:170%;height:152%;pointer-events:none}
.mem.dead .sp canvas{filter:none}
.mem .sh2{position:absolute;bottom:-3px;left:12%;right:12%;height:10px;border-radius:50%;background:#000a;filter:blur(4px)}
.mem .tg{font-size:clamp(8px,1.35vh,11px);font-weight:800;margin-top:2px;white-space:nowrap;text-shadow:0 1px 3px #000}
.mem .tg em{font-style:normal;opacity:.75;font-weight:600}
.mem .hb{height:clamp(6px,1.1vh,9px);border-radius:99px;background:#0a0a12;border:1px solid #000;overflow:hidden;margin-top:2px;box-shadow:0 0 0 1px #fff2}
.mem .hb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#86efac);transition:width .5s}
.mem.me .tg{color:var(--bc2)}
.mem.me:after{content:'';position:absolute;left:50%;top:-4px;width:0;height:0;transform:translateX(-50%);border:6px solid transparent;border-top:9px solid var(--bc);filter:drop-shadow(0 0 6px var(--bc));animation:bounce 1s ease-in-out infinite}
.mem.dead{filter:grayscale(1) brightness(.5);opacity:.55}
.mem .ic{position:absolute;top:-6px;right:-2px;display:flex;gap:2px;font-size:clamp(11px,2vh,16px);z-index:3}
.mem .guard{position:absolute;left:50%;top:38%;width:120%;height:90%;transform:translate(-50%,-50%) scale(.2);border-radius:50%;border:3px solid #86efac;background:radial-gradient(circle,#86efac22,#86efac66);box-shadow:0 0 22px #86efac,inset 0 0 18px #86efac88;opacity:0;pointer-events:none;z-index:4}
.mem.def .guard{animation:gin .35s ease-out forwards}
.mem .frz{position:absolute;inset:-6% 4%;border-radius:14px;background:linear-gradient(160deg,#e0f2fe99,#7dd3fc66);border:2px solid #e0f2fe;box-shadow:0 0 18px #7dd3fc;opacity:0;pointer-events:none;z-index:5;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,3vh,24px);transition:opacity .3s}
.mem.fz .frz{opacity:1}
.mem .vdx{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#a855f755,transparent 70%);opacity:0;animation:vd 1.2s ease-in-out infinite;pointer-events:none}
.mem.vd .vdx{opacity:1}
#fxc{position:absolute;left:0;top:0;width:100%;height:100%;z-index:19;pointer-events:none}
#fx{position:absolute;inset:0;z-index:20;pointer-events:none;overflow:hidden}
#fx .f{position:absolute;left:0;top:0;pointer-events:none}
#fx .ban{left:50%;top:40%}
.num{font-family:var(--px);font-size:clamp(12px,2.6vh,22px);text-shadow:0 2px 0 #000,0 0 10px currentColor;white-space:nowrap}
.ban{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--px);text-align:center;white-space:nowrap;text-shadow:0 4px 0 #000,0 0 26px currentColor}
#vig{position:absolute;inset:0;z-index:15;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,#ef4444aa 100%)}
#vig.on{animation:vigA .55s ease-in-out infinite alternate}
#dim{position:absolute;inset:0;z-index:14;pointer-events:none;background:#000;opacity:0;transition:opacity .5s}
#ctl{position:relative;z-index:30;display:grid;grid-template-columns:minmax(140px,.7fr) minmax(0,2.2fr) minmax(120px,.6fr);gap:clamp(6px,1vw,14px);padding:clamp(6px,1.2vh,12px) clamp(8px,2vw,22px);background:linear-gradient(0deg,#000,rgba(10,8,22,.94));border-top:2px solid color-mix(in srgb,var(--bc) 60%,#000)}
#info{display:flex;flex-direction:column;gap:4px;justify-content:center;font-size:clamp(9px,1.5vh,12px)}
#msg{grid-column:1/-1;font-size:clamp(10px,1.7vh,14px);font-weight:700;min-height:1.4em;color:#f5f3ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#moves{display:grid;grid-template-columns:1fr 1fr;gap:clamp(4px,.8vh,8px)}
.mv{position:relative;text-align:left;padding:clamp(5px,1vh,10px) clamp(8px,1.2vw,14px);border-radius:10px;border:1px solid var(--line);border-left:5px solid var(--tc);background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 22%,#0c0a18),#0c0a18);overflow:hidden;transition:transform .1s,box-shadow .2s}
.mv:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 0 16px color-mix(in srgb,var(--tc) 55%,transparent)}
.mv b{display:block;font-size:clamp(10px,1.7vh,14px);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv small{display:flex;justify-content:space-between;font-size:clamp(8px,1.3vh,11px);opacity:.85;margin-top:2px;gap:6px}
.mv .ef.s{color:#4ade80}.mv .ef.w{color:#fca5a5}.mv .ef.z{color:#9ca3af}
#side{display:flex;flex-direction:column;gap:6px;justify-content:center}
#warn{padding:6px 8px;border-radius:10px;font-size:clamp(8px,1.35vh,11px);font-weight:800;line-height:1.3;border:1px solid var(--line);background:rgba(255,255,255,.06)}
#warn.u{border-color:#ef4444;background:#7f1d1d88;animation:vigA .6s ease-in-out infinite alternate;color:#fecaca}
#warn.c{border-color:#f59e0b;background:#78350f77;color:#fde68a}
.guardbtn{padding:clamp(6px,1.2vh,12px);border-radius:10px;border:1px solid #86efac88;background:linear-gradient(180deg,#14532d,#052e16);font-weight:800;font-size:clamp(9px,1.5vh,12px)}
.guardbtn:hover:not(:disabled){box-shadow:0 0 16px #22c55e88}
/* ---------- overlays ---------- */
#ov{position:absolute;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(3,2,10,.82);backdrop-filter:blur(5px);padding:14px}
#ov.on{display:flex;animation:fin .4s ease}
.box{width:min(94vw,560px);max-height:94dvh;overflow:auto;border-radius:20px;border:2px solid var(--bc);background:linear-gradient(180deg,#14102a,#0a0818);box-shadow:0 0 44px color-mix(in srgb,var(--bc) 50%,transparent);padding:clamp(14px,3vh,28px);text-align:center;display:flex;flex-direction:column;gap:clamp(8px,1.6vh,16px);align-items:center}
.box h2{font-family:var(--px);font-size:clamp(14px,3.4vh,26px);text-shadow:0 3px 0 #000}
.box h2.w{color:#fde047;text-shadow:0 3px 0 #000,0 0 28px #facc15}
.box h2.l{color:#fca5a5}
.cnt{font-family:var(--px);font-size:clamp(11px,2.2vh,17px)}
.eggs{position:relative;width:clamp(110px,26vh,190px);height:clamp(140px,32vh,230px);display:flex;align-items:center;justify-content:center}
.egg{position:relative;width:70%;height:84%;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(circle at 35% 28%,#fff 0,#e9d5ff 20%,#a78bfa 58%,#4c1d95);box-shadow:0 0 36px #a78bfa,inset -10px -14px 26px #2e106588;animation:wob 1.2s ease-in-out infinite}
.egg i{position:absolute;border-radius:50%;background:#6d28d9aa}
.egg svg{position:absolute;inset:0;width:100%;height:100%}
.egg svg path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 6px #fff);stroke-dasharray:200;stroke-dashoffset:200}
.egg.c1 svg .k1,.egg.c2 svg .k1,.egg.c3 svg .k1{animation:crk .5s forwards}
.egg.c2 svg .k2,.egg.c3 svg .k2{animation:crk .5s forwards}
.egg.c3 svg .k3{animation:crk .5s forwards}
.egg.sh{animation:wob .22s ease-in-out infinite}
.rev{display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.rev canvas{height:clamp(110px,28vh,220px);width:clamp(110px,28vh,220px);filter:drop-shadow(0 0 20px var(--rc))}
.rar{font-family:var(--px);font-size:clamp(10px,2vh,14px);padding:6px 12px;border-radius:8px;background:var(--rc);color:#10091f;box-shadow:0 0 18px var(--rc)}
#flash{position:absolute;inset:0;z-index:120;background:#fff;opacity:0;pointer-events:none}
/* ---------- animações ---------- */
#cam{position:absolute;inset:0;transform-origin:50% 60%;animation:cam 16s ease-in-out infinite}
@keyframes cam{0%,100%{transform:scale(1) translate(0,0)}30%{transform:scale(1.025) translate(-.8%,.4%)}65%{transform:scale(1.015) translate(.7%,-.3%)}}
@media (prefers-reduced-motion: reduce){#cam{animation:none}}
@keyframes bfloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2.4%) scale(1.012)}}
@keyframes halo{0%,100%{opacity:.6;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
@keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
@keyframes chg{from{filter:drop-shadow(0 0 20px var(--bc)) brightness(1)}to{filter:drop-shadow(0 0 60px #fff) brightness(1.7) saturate(1.3)}}
@keyframes vigA{from{opacity:.25}to{opacity:.9}}
@keyframes shd{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.03)}}

   lvP(lvB(),'cast',{dir:Math.sign(V.x-T.x)||1});if(!RM)bi.animate([{transform:'translate(0,0)'},{transform:`translate(${(V.x-T.x)*.1}px,${(V.y-T.y)*.1}px)`,offset:.4},{transform:'translate(0,0)'}],{duration:760,easing:'ease-in-out'});
   let Dp=V;
   if(e.redir){const o=memEl(e.who),oc=ctr(o.querySelector('.sp')),dx=oc.x-V.x,dy=oc.y-V.y;Dp={x:V.x+dx*.55,y:V.y+dy*.55};if(!RM)tel.animate([{transform:'translate(-50%,-50%)'},{transform:`translate(calc(-50% + ${dx*.55}px),calc(-50% + ${dy*.55}px)) scale(1.1)`,offset:.2},{transform:`translate(calc(-50% + ${dx*.55}px),calc(-50% + ${dy*.55}px)) scale(1.1)`,offset:.85},{transform:'translate(-50%,-50%)'}],{duration:1400,easing:'ease-in-out'});setMsg(tg.tr+' se joga na frente de '+mem(e.who).tr+'!');lvP(lvM(e.tgt),'def');pop('PROTEGIDO!',oc,'#86efac',50)}
   await bossFx(bb.id,bkey(e),T,[{pos:Dp}],()=>{snd('hit');lvP(lvM(e.tgt),'hit',{dir:Math.sign(V.x-T.x)||1});shake(tel,9,380);tint(tel.querySelector('.sp'),'#ef4444',420);pop('−'+e.dmg,Dp,e.block?'#fcd34d':'#fb7185',20);
    tg.hp=e.hp;hpBar(tg);if(e.heal){const bc=bossC();pop('+'+e.heal,bc,'#4ade80',60);proj(Dp,bc,'#a855f7','orb',420);ST.b.hp=e.bhp;bossBar()}});
   return 450}
  case 'baoe':{
   const bb=bd(),col=TC[e.ty]||bb.col,T=bossC(),bi=$('#bimg');setMsg(bb.n+' usa '+e.name+'!');
   if(e.ult){
    $('#boss').classList.remove('charging');$('#vig').classList.remove('on');$('#dim').style.opacity=.75;snd('big');
    banner(e.name.toUpperCase(),col,Math.min(40,innerWidth/14),2100);
    lvP(lvB(),'roar');if(!RM)bi.animate([{transform:'translateY(0) scale(1)'},{transform:'translateY(-5%) scale(1.1)',offset:.4},{transform:'translateY(0) scale(1)'}],{duration:1200,easing:'ease-in-out'});
    await sleep(500);
   }else{lvP(lvB(),'cast');await sleep(200);snd('big')}
   let first=true;
   await bossFx(bb.id,bkey(e),T,e.hits.map(h=>({pos:ctr(memEl(h.who).querySelector('.sp'))})),k=>{const h=e.hits[k],m=mem(h.who),el=memEl(h.who),V=ctr(el.querySelector('.sp'));
    if(first){first=false;shake($('#stage'),e.ult?14:7,e.ult?800:400);if(e.ult&&e.bar>0)B.party.filter(x=>memEl(x.id).classList.contains('def')).forEach(x=>{const c=ctr(memEl(x.id).querySelector('.sp'));ring(c,'#86efac',120,900)})}
    snd('hit');lvP(lvM(h.who),'hit',{dir:Math.sign(V.x-T.x)||1});shake(el,10,420);tint(el.querySelector('.sp'),'#ef4444',420);pop('−'+h.dmg,V,h.def?'#fcd34d':'#fb7185',20);m.hp=h.hp;hpBar(m)});
   if(e.ult&&e.bar>0)pop('BARREIRA CONJUNTA −'+e.bar+'%',{x:stg().clientWidth/2,y:stg().clientHeight*.62},'#86efac',0);
   if(e.ult)setTimeout(()=>{$('#dim').style.opacity=0},500);
   return e.ult?900:450}
  case 'st':{const el=memEl(e.who),V=ctr(el.querySelector('.sp'));
   if(e.k==='void'){lvP(lvM(e.who),'hit');burst(V,'#a855f7',8,60,'🌀');pop('−'+e.dmg,V,'#c084fc',20);mem(e.who).hp=e.hp;hpBar(mem(e.who));const bc=bossC();proj(V,bc,'#a855f7','orb',420)}
   else{el.classList.add('fz');mem(e.who).fz=1;pop('⏳ CONGELADO',V,'#7dd3fc',40);ring(V,'#7dd3fc',100,800)}
   return 500}
  case 'bheal':{pop('+'+e.v,bossC(),'#4ade80',60);ST.b.hp=e.hp;bossBar();return 300}
  case 'faint':{const m=mem(e.who),el=memEl(e.who);m.hp=0;m.alive=false;hpBar(m);el.classList.add('dead');el.classList.remove('def');lvP(lvM(e.who),'faint');setMsg(m.tr+' caiu em combate!');await sleep(300);return 450}
  default:return 100}
}
async function playTurn(evs){
 const cur=B;
 for(let i=0;i<evs.length;i++){
  if(B!==cur)return;
  const e=evs[i];
  if(e.t==='atk'){ // ataques juntos, escalonados
   const g=[];while(i<evs.length&&evs[i].t==='atk'){g.push(evs[i]);i++}i--;
   setMsg(g.length>1?'O grupo ataca em conjunto!':mem(g[0].who).tr+' ataca!');
   await Promise.all(g.map((x,k)=>playAtk(x,k*170).catch(()=>{})));await sleep(250);continue}
  let d=0;try{d=await ev(e,evs)}catch(err){if(B===cur)throw err;return}if(d)await sleep(d)
 }
 document.querySelectorAll('.mem.def').forEach(e=>e.classList.remove('def'));
}
async function onTurn(m){
 const cur=B;await playTurn(m.evs);if(B!==cur||!B)return;applySnap(m.snap);B.warn=m.warn||B.warn;
 if(m.over){B.over=m.over;await finish(m)}
 else{busy=false;renderCtl(m.warn)}
}
async function finish(m){
 const cur0=B;if(!B)return;const win=m.over==='win',bb=bd(),T=bossC();$('#boss').classList.remove('charging');$('#vig').classList.remove('on');
 if(win){snd('win');setMsg(bb.n+' foi derrotado!');B.party.forEach((p,k)=>{if(p.hp>0)setTimeout(()=>lvP(lvM(p.id),'cheer').then(()=>lvP(lvM(p.id),'cheer')),k*120)});
  for(let i=0;i<4;i++){flash(.6,300);burst(T,bb.col,20,170,'✨');await sleep(260)}
  const bi=$('#bimg');if(!RM)bi.animate([{transform:'scale(1)',opacity:1,filter:'brightness(1)'},{transform:'scale(1.06)',opacity:1,filter:'brightness(3)',offset:.5},{transform:'scale(.7) translateY(-8%)',opacity:0,filter:'brightness(6)'}],{duration:1500,fill:'forwards',easing:'ease-in'});
  for(let i=0;i<30;i++){const e=fxEl('',{left:T.x+(Math.random()*160-80)+'px',top:T.y+(Math.random()*160-80)+'px',width:'14px',height:'14px',background:`linear-gradient(135deg,#fff,${bb.col})`,transform:'rotate(45deg)',boxShadow:`0 0 12px ${bb.col}`},2200);e.animate([{opacity:1,translate:'0 0'},{opacity:0,translate:`${Math.random()*120-60}px ${-120-Math.random()*220}px`}],{duration:1500+Math.random()*700,easing:'ease-out'})}
  await sleep(1900)}
 else{snd('lose');setMsg(bb.n+' venceu...');lvP(lvB(),'roar');$('#dim').style.opacity=.7;shake($('#stage'),12,800);await sleep(1400)}
 D.frag=m.frag;D.eggs=m.eggs;D.coins=m.coins;D.best=m.best;if(win){D.claimed=true;D.win=true}D.tries++;
 showResult(m,win)
}
function showResult(m,win){
 const bb=bd(),r=m.reward;
 $('#ov').innerHTML=`<div class="box"><h2 class="${win?'w':'l'}">${win?'VITÓRIA!':'DERROTA'}</h2>
  <div class="px" style="font-size:clamp(9px,1.6vh,12px);color:var(--mut)">${win?bb.n+' foi derrotado em '+m.turn+' turnos':bb.n+' resistiu... tente de novo!'}</div>
  <div class="card" style="width:100%"><span class="sec">SEU DANO TOTAL</span><div class="cnt" style="color:var(--bc);margin-top:4px" id="sc">0</div><small style="color:var(--mut)">melhor da semana: ${m.best.toLocaleString('pt-BR')}</small></div>
  ${r?`<div class="sec">RECOMPENSAS</div><div class="rw" style="justify-content:center"><div class="rwi" id="r1"><i class="frag" style="--fc:${bb.col}"></i> +${r.frag} fragmentos</div><div class="rwi" id="r2">🪙 +${r.coins}</div><div class="rwi" id="r3"><span class="eggbig" style="width:20px;height:26px;display:inline-block"></span> +${r.egg} ovo misterioso</div></div>`:win?'<div class="card">Recompensas desta semana já recebidas. O resultado conta para o ranking.</div>':'<div class="card">Dica: use 🛡 Proteger na ultimate e ataque em conjunto para ativar a Sincronia.</div>'}
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${r?`<button class="btn go" id="hb">CHOCAR OVO</button>`:''}<button class="btn ${r?'':'go'}" id="again">TENTAR DE NOVO</button><button class="btn" id="out">LOBBY</button></div></div>`;
 $('#ov').classList.add('on');
 const sc=$('#sc');let t0=performance.now();const tgt=m.score;(function f(t){const k=Math.min(1,(t-t0)/1200);sc.textContent=Math.round(tgt*k).toLocaleString('pt-BR');if(k<1)requestAnimationFrame(f)})(t0);
 if(r){['r1','r2','r3'].forEach((id,i)=>{const e=$('#'+id);e.animate([{transform:'scale(.2)',opacity:0},{transform:'scale(1.25)',opacity:1,offset:.6},{transform:'scale(1)'}],{duration:600,delay:500+i*300,fill:'backwards'})});
  $('#hb').onclick=()=>{$('#ov').classList.remove('on');toLobby();post({k:'hatch'});hatchStart()}}
 $('#again').onclick=()=>{$('#ov').classList.remove('on');post({k:'start',pick})};
 $('#out').onclick=()=>{$('#ov').classList.remove('on');toLobby()};
}
function askLeave(){
 if(!B||B.over)return;
 $('#ov').innerHTML=`<div class="box"><h2 class="l">SAIR DO RAID?</h2><div class="card">Você abandona a luta contra ${bd().n}. O dano causado até agora conta para o ranking, mas não há recompensa.</div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn go" id="stay">CONTINUAR LUTANDO</button><button class="btn" id="quit">SAIR</button></div></div>`;
 $('#ov').classList.add('on');
 $('#stay').onclick=()=>$('#ov').classList.remove('on');
 $('#quit').onclick=()=>{post({k:'leave'});$('#ov').classList.remove('on');busy=false;toLobby()};
}
function toLobby(){mode='lobby';B=null;$('#battle').classList.add('hidden');$('#lobby').classList.remove('hidden');renderLobby()}

/* ---------- ovo ---------- */
function hatchStart(){
 mode='hatch';$('#ov').innerHTML=`<div class="box" style="--rc:#a78bfa"><h2 class="px" style="font-size:clamp(11px,2.4vh,18px);color:#ddd6fe">OVO MISTERIOSO</h2>
  <div class="eggs" id="eggw"><div class="egg" id="egg"><i style="width:18%;height:14%;left:22%;top:30%"></i><i style="width:13%;height:10%;left:58%;top:46%"></i><i style="width:16%;height:12%;left:34%;top:64%"></i><svg viewBox="0 0 100 120"><path class="k1" d="M50 8 L44 30 L56 44 L46 64"/><path class="k2" d="M18 52 L36 58 L40 76 L30 92"/><path class="k3" d="M82 50 L66 60 L70 80 L60 98"/></svg></div></div>
  <div id="hmsg" class="px" style="font-size:clamp(9px,1.7vh,12px);color:#ddd6fe">Algo está se mexendo...</div></div>`;
 $('#ov').classList.add('on');snd('tick')
}
async function onHatch(m){
 if(m.err){$('#ov').innerHTML=`<div class="box"><h2 class="l">Ops</h2><div class="card">${m.err}</div><button class="btn go" id="x">OK</button></div>`;$('#x').onclick=()=>{$('#ov').classList.remove('on');toLobby()};return}
 Object.assign(IM,m.imgs||{});D.eggs=m.eggs;
 const egg=$('#egg');if(!egg)return;
 await sleep(800);egg.classList.add('sh');for(let k=1;k<=3;k++){await sleep(900);egg.classList.remove('sh');egg.classList.add('c'+k);snd('crack');shake($('#eggw'),6,300);egg.classList.add('sh');if(k===3)break}
 await sleep(900);flash(1,900);snd('win');
 const col=m.col;
 $('#ov').innerHTML=`<div class="box" style="--rc:${col};border-color:${col}"><div class="rev"><canvas data-lv="${img('f'+m.i)}" data-rig="${famOf(m)}" data-pad=".15,.15,.3,.1" role="img" aria-label="${m.n}"></canvas><div class="rar">${m.rar.toUpperCase()}</div><h2 style="color:${col}">${m.n}</h2><div class="px" style="font-size:clamp(9px,1.6vh,12px);color:var(--mut)">Nv ${m.l} · ${TE[m.t]} ${m.t}${m.t2?' · '+TE[m.t2]+' '+m.t2:''}</div><div class="card">Entrou para a sua equipe!</div></div>
  <div style="display:flex;gap:8px"><button class="btn go" id="x">FECHAR</button></div></div>`;
 burst({x:innerWidth/2,y:innerHeight*.4},col,0,0);liveScan($('#ov'));const rv=$('.rev canvas');if(rv&&rv._lv){rv._lv.play('enter').then(()=>rv._lv.play('cheer'))}
 $('#x').onclick=()=>{$('#ov').classList.remove('on');toLobby()}
}

/* ---------- mensagens ---------- */
addEventListener('message',e=>{const m=e.data||{};if(!m.numius)return;
 if(m.k==='bsdata'){if(m.imgs)Object.assign(IM,m.imgs);D=m;if(mode==='lobby')renderLobby()}
 else if(m.k==='bsstart'){startBattle(m)}
 else if(m.k==='bsturn'){onTurn(m)}
 else if(m.k==='bshatch'){onHatch(m)}
});
$('#leave').onclick=askLeave;
post({k:'ready'});
})();
</script>
</body>
