        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;600&family=Patrick+Hand&family=Nunito:wght@700;800&family=Share+Tech+Mono&display=swap');
        :root{
          --neon-cyan:#00E5FF;
          --neon-purple:#8b5cf6;
          --neon-pink:#ff4ecd;
        }
        .pixel-font{ font-family: 'Press Start 2P', monospace; }
        .hand{ font-family: 'Patrick Hand', cursive; }
        .nunito{ font-family: 'Nunito', sans-serif; }
        .mono-tech{ font-family: 'JetBrains Mono','Share Tech Mono', monospace; }
        .paper-texture{
          background-image: radial-gradient(#ffffff14 1px, transparent 1px);
          background-size: 20px 20px;
        }
        .tech-grid{
          background-image:
            linear-gradient(90deg, rgba(0,229,255,0.14) 1px, transparent 1px),
            linear-gradient(0deg, rgba(0,229,255,0.08) 1px, transparent 1px);
          background-size: 36px 36px, 36px 36px;
        }

        @keyframes twinkle { 0%,100%{ opacity:0.2} 50%{ opacity:1} }
        @keyframes bobToast { 0%,100%{ transform: translateY(0)} 50%{ transform: translateY(-4px)} }

        /* --- ORIGINAL COZY BREATHES --- */
        @keyframes breatheGrass { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        @keyframes breatheFire { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
        @keyframes breatheWater { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        @keyframes bobGrassSoft { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }
        @keyframes floatWaterSoft { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
        @keyframes floatFireIdle { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-2px); } }
        @keyframes fireHopCycle { 0%,78%,100% { transform: translateY(0px); } 84% { transform: translateY(-2px); } 88% { transform: translateY(-9px); } 92% { transform: translateY(0px); } 94% { transform: translateY(-1px); } }
        @keyframes tiltGrassOcc { 0%,72%,100% { transform: rotate(0deg); } 80% { transform: rotate(-3deg); } 86% { transform: rotate(2.5deg); } 92% { transform: rotate(0deg); } }
        @keyframes nodFireOcc { 0%,68%,100% { transform: rotate(0deg); } 78% { transform: rotate(-4deg); } 86% { transform: rotate(1deg); } }
        @keyframes swayWaterTail { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(4deg); } }
        @keyframes tailGrass8 { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(5deg); } }
        @keyframes tailFire8 { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(6deg); } }
        @keyframes shadowSoft { 0%,100% { transform: translateX(-50%) scaleX(1); opacity:0.22; } 50% { transform: translateX(-50%) scaleX(1.10); opacity:0.28; } }
        @keyframes shadowWaterSoft { 0%,100% { transform: translateX(-50%) scaleX(1); opacity:0.18; } 50% { transform: translateX(-50%) scaleX(1.08); opacity:0.22; } }
        @keyframes flamePulseSoft { 0%,100% { opacity:1; transform: scale(0.98); } 50% { opacity:1; transform: scale(1.03); } }
        @keyframes leafDrift { 0% { transform: translateY(-10px) translateX(0px) rotate(0deg); opacity:0; } 15% { opacity:0.8; } 100% { transform: translateY(26px) translateX(6px) rotate(90deg); opacity:0; } }
        @keyframes bubbleRiseSoft { 0% { transform: translateY(0px) scale(0.3); opacity:0; } 15% { opacity:0.85; } 100% { transform: translateY(-36px) scale(1); opacity:0; } }
        @keyframes emberFloat { 0% { transform: translateY(0px) scale(0.6); opacity:0.7; } 100% { transform: translateY(-28px) translateX(4px) scale(0); opacity:0; } }
        @keyframes hoverCuteJump { 0% { transform: translateY(0) scale(1); } 35% { transform: translateY(-12px) scale(1.04); } 60% { transform: translateY(0) scale(0.98); } 80% { transform: translateY(-2px) scale(1.01); } 100% { transform: translateY(0) scale(1); } }
        @keyframes heartPop { 0% { transform: translateY(0) scale(0.2) rotate(-10deg); opacity:0; } 20% { opacity:1; transform: translateY(-6px) scale(1.15) rotate(5deg); } 100% { opacity:0; transform: translateY(-28px) scale(0.8) rotate(10deg); } }

        /* --- TECH TITLE --- */
        @keyframes holoGlitch {
          0%, 88%, 100% { transform: none; text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-purple); filter: hue-rotate(0deg); }
          89% { transform: translateX(1.5px) skewX(6deg); text-shadow: -2px 0 #ff4ecd, 2px 0 #00E5FF; filter: hue-rotate(15deg); }
          90% { transform: translateX(-1.2px) skewX(-4deg); text-shadow: 2px 0 #ff4ecd, -2px 0 #00E5FF; }
          91% { transform: translateX(0); }
          92% { transform: translateX(0.8px); filter: brightness(1.4); }
          93% { transform: none; }
        }
        @keyframes ledPulseBorder {
          0%,100% { box-shadow: 0 0 12px #00E5FF66, 0 0 28px #00E5FF33, inset 0 0 12px #00E5FF22; border-color: #00E5FF; }
          50% { box-shadow: 0 0 18px #00E5FFaa, 0 0 36px #7a5cff66, 0 0 48px #00E5FF33, inset 0 0 18px #00E5FF33; border-color: #7af0ff; }
        }
        @keyframes scanlineMove {
          0% { transform: translateY(-100%); }
          100% { transform: translateY(100%); }
        }
        @keyframes ledBlink { 0%, 60% { opacity:1; box-shadow: 0 0 6px currentColor; } 61%, 100% { opacity:0.25; } }
        @keyframes cursorBlink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
        @keyframes circuitFlow { 0% { opacity:0.2; } 50% { opacity:1; } 100% { opacity:0.2; } }

        /* --- MAP ELEMENTS --- */
        @keyframes swayTuft { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
        @keyframes swayTuftFast { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(14deg); } }
        @keyframes trembleSoft { 0%,100% { transform: translate(0,0); } 25% { transform: translate(0.5px, -0.5px); } 75% { transform: translate(-0.5px, 0.3px); } }
        @keyframes trembleIntense { 0%,100% { transform: translate(0,0); } 25% { transform: translate(1.2px, -1px); } 50% { transform: translate(-1px, 0.8px); } 75% { transform: translate(0.8px, 0.6px); } }
        @keyframes leafScatterUp { 0% { transform: translateY(0) rotate(0deg); opacity:0.9; } 100% { transform: translateY(-28px) translateX(12px) rotate(75deg); opacity:0; } }
        @keyframes mushroomGlow { 0%,100% { box-shadow: 0 0 6px #aaff88, 0 0 12px #88ff66; filter: brightness(1); } 50% { box-shadow: 0 0 12px #aaff88, 0 0 22px #88ff66, 0 0 30px #aaff88aa; filter: brightness(1.25); } }
        @keyframes mushroomGlowIntense { 0%,100% { box-shadow: 0 0 14px #c8ff8a, 0 0 28px #88ff66, 0 0 40px #aaff88; transform: scale(1.1); } 50% { box-shadow: 0 0 20px #e0ffb0, 0 0 36px #88ff66, 0 0 52px #aaff88; transform: scale(1.15); } }
        @keyframes lavaPulse { 0%,100% { transform: translateX(-50%) scale(1); opacity:0.85; filter: brightness(1); } 50% { transform: translateX(-50%) scale(1.08); opacity:1; filter: brightness(1.2); } }
        @keyframes lavaPulseIntense { 0%,100% { transform: translateX(-50%) scale(1.12); opacity:1; filter: brightness(1.35) saturate(1.2); } 50% { transform: translateX(-50%) scale(1.22); opacity:1; filter: brightness(1.5); } }
        @keyframes crackGlow { 0%,100% { opacity:0.6; box-shadow: 0 0 4px #ff8a2a; } 50% { opacity:1; box-shadow: 0 0 10px #ff7a2a, 0 0 16px #ff5a00; } }
        @keyframes sparkRiseFast { 0% { transform: translateY(0) scale(0.8); opacity:1; } 100% { transform: translateY(-44px) translateX(8px) scale(0); opacity:0; } }
        @keyframes rippleWater { 0% { transform: translateX(-50%) scale(0.85); opacity:0.8; } 50% { transform: translateX(-50%) scale(1.05); opacity:0.6; } 100% { transform: translateX(-50%) scale(0.85); opacity:0.8; } }
        @keyframes rippleIntense { 0% { transform: translateX(-50%) scale(0.9); opacity:1; } 50% { transform: translateX(-50%) scale(1.25); opacity:0.9; } 100% { transform: translateX(-50%) scale(0.9); opacity:1; } }
        @keyframes crystalShine { 0%,100% { filter: brightness(1) drop-shadow(0 0 4px #7ee6ff); transform: scale(1) rotate(45deg); } 50% { filter: brightness(1.6) drop-shadow(0 0 10px #00E5FF); transform: scale(1.15) rotate(45deg); } }
        @keyframes dropletFall { 0% { transform: translateY(-6px); opacity:0; } 15% { opacity:1; } 100% { transform: translateY(18px); opacity:0; } }

<script>
(function(){
 var post=function(m){m.numius=1;parent.postMessage(m,'*')};

 '.nx-b{display:block;width:100%;height:46px;margin-top:12px;border-radius:12px;border:2px solid #0a1030;font:700 12px ui-monospace,monospace;letter-spacing:2px;cursor:pointer;box-shadow:0 4px 0 #0a1030}.nx-b:active{transform:translateY(3px);box-shadow:0 1px 0 #0a1030}'+

 attach();

 function val(sel){var e=document.querySelector('#root '+sel);return e?e.value:''}

   return}
  var b=t.closest('button');if(!b)return;var x=(b.innerText||'').toUpperCase();
